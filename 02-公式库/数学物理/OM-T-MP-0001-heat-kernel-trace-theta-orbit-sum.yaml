caveat: >-
  本卡不重做证明，也不声明任何新结果（红线一、红线八）。它做的是三件更窄的事：
  ①用两条互不相干的生产者读同一条恒等式——谱侧是自己写的逐项求和循环（不调任何 theta 库），
  轨道侧是像电荷求和，两条同值才计一次数；第三枚生产者（sympy 数值求和与 mpmath 逐项求和）
  在判定 3、判定 5 上各自复算；
  ②给「残差随精度收缩」定价：每格的相对残差与尺度并列印出，并在由该格尺度现定的第二档上重跑，
  印放大倍数——放大倍数低于 1e+15 判真差、非零残差低于地板判不可比，两种「看不见」不许混成「通过」；
  ③把不等式那一格按界的量级定档（判定 5），并用 G2 对照证明低位读数会把一条真的先验界判成反例。
  须记住的是：判定 2 那五格返回**恰好 Zero** 是符号机的归约，不是对一般 k 的证明；
  判定 3 是代数重排的复算，不构成第二台独立生产者；
  判定 4a 中三格 BELOW_FLOOR（170 位档上两族全同）只证明「两条独立生产者落在同一个数上」，
  其地板由该格精度驱动，脚本另配 G1 五格对照证明这根地板尺随档位翻判决、不会把正确读数咬红。

