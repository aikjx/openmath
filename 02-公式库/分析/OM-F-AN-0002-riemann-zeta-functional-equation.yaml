  - "30B40"
tags:
  - ζ函数
  - 解析延拓
  - 函数方程
  - 黎曼假设

status: VERIFIED(L3)
evidence_level: L3
revision: 1
created: 2026-09-10
updated: 2026-09-10

latex: >-
  \zeta(s) = 2^{s} \pi^{s-1} \sin\left(\frac{\pi s}{2}\right) \Gamma(1-s) \zeta(1-s)

sympy: >-
  zeta(s) - 2**s * pi**(s-1) * sin(pi*s/2) * gamma(1-s) * zeta(1-s)

assumptions:
  - ζ(s) 由级数 Σ n^{-s}（Re(s) > 1）定义，并通过解析延拓延拓到 ℂ \ {1}
  - Γ 为 Euler Gamma 函数，采用标准定义 Γ(z) = ∫_0^∞ t^{z-1} e^{-t} dt
  - 采用主值分支
  - s ≠ 1（ζ 在 s=1 处有一阶极点）

symbols:
  - name: "s"
    meaning_zh: "复变量"
    type: complex
    constraints: "s ≠ 1"
  - name: "zeta"
    meaning_zh: "Riemann ζ 函数"
    type: function
    constraints: "亚纯函数，唯一极点在 s=1，留数为 1"
  - name: "Gamma"
    meaning_zh: "Gamma 函数"
    type: function
    constraints: "阶乘的解析延拓"

domain_of_validity: "所有 s ∈ ℂ \\ {1}。亦常写作对称形式 ξ(s) = ξ(1-s)，其中 ξ(s) = (1/2) s(s-1) π^{-s/2} Γ(s/2) ζ(s)"

specializations: []
generalizations:
  - "狄利克雷 L-函数的函数方程（待录入）"
related:
  - OM-F-AN-0001

caveat: >-
  1) 数值验证必须用解析延拓实现（mpmath.zeta 已实现），不能直接求和级数
     —— 在 Re(s) < 1 时级数发散，直接求和会得到毫无意义的结果。
  2) 在平凡零点 s = -2, -4, -6, ... 处两边同时为零，这类点不构成有效检验点
     （需选取非平凡点，如 s = 0.5 + 14.134725i）。
  3) Γ(1-s) 在 s 为正整数时发散，与 sin(πs/2) 的零点相互抵消；数值上
     会出现 0 × ∞ 型不稳定，需 50 位以上精度。
  4) SymPy 的 zeta 在部分区域依赖假设传播，L3 判定必须显式声明 s 非正整数。

