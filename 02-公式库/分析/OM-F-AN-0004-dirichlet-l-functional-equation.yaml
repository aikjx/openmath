latex: >-
  \Lambda(s,\chi)=\left(\frac{q}{\pi}\right)^{(s+a)/2}\Gamma\!\left(\frac{s+a}{2}\right)L(s,\chi),\quad
  a=\frac{1-\chi(-1)}{2},\qquad
  \Lambda(s,\chi)=\frac{\tau(\chi)}{i^{a}\sqrt{q}}\,\Lambda(1-s,\overline{\chi}),\quad
  \tau(\chi)=\sum_{r=1}^{q}\chi(r)e^{2\pi i r/q},\ \ |\tau(\chi)|=\sqrt{q}

assumptions:
  # 第 11 批（2026-10-18）改写：本库 YAML 子集不折列表项续行、也不认列表项里的 >-，
  # 旧写法在机读面上只解析出 3 枚（源文 5 枚）；普查面 scratch/T11_PARSELOSS_face.txt。
  # 现全部写成「单行＋双引号」，一枚不少；行内避开 ASCII 冒号空格（那会把散文劈成 dict）。
  - "χ 是模 q 的**原始**（primitive）Dirichlet 特征；合模（非原始）需先换成导子（conductor）形式"
  - "本记录只对**非主特征**做了数值检验：L(s,χ₀)（主特征）在 s=1 有极点，Hurwitz 路线的极点不抵消"
  - "L(s,χ) 在 Re(s) > 1 由 Dirichlet 级数 Σ χ(n)n^{-s} 定义，其余处取解析延拓；检验脚本走恒等式 L(s,χ) = q^{-s} Σ_{r=1}^{q} χ(r) ζ_H(s, r/q)"
  - "a = (1 − χ(−1))/2 ∈ {0,1}：χ(−1)=+1 为偶特征（a=0），χ(−1)=−1 为奇特征（a=1）"
  - "Γ 取标准 Euler Gamma；i 为虚单位，i^a 按 a∈{0,1} 单值取"

symbols:
  - name: "s"
    meaning_zh: "复变量，函数方程把它送到 1-s"
    type: complex
    constraints: "s ∈ ℂ（非主特征下 Λ 为整函数）"
  - name: "chi"
    meaning_zh: "模 q 的原始 Dirichlet 特征（本记录检验时取 χ₄、χ₃、χ₅、χ₇ 四个）"
    type: function
    constraints: "完全积性 + 周期 q + 原始；χ̄ 为逐点复共轭特征"
  - name: "q"
    meaning_zh: "特征模（conductor 情形下的模）"
    type: integer
    constraints: "q >= 1；本记录数值检验取 q ∈ {3,4,5,7}"
  - name: "a"
    meaning_zh: "特征奇偶指示 a = (1 − χ(−1))/2"
    type: integer
    constraints: "a ∈ {0,1}"
  - name: "tau"
    meaning_zh: "Gauss 和 τ(χ) = Σ_{r=1..q} χ(r) e^{2πir/q}"
    type: function
    constraints: "χ 原始时 |τ(χ)| = √q，故根数 ε(χ) = τ(χ)/(i^a √q) 模为 1"
  - name: "L"
    meaning_zh: "Dirichlet L-函数 L(s,χ)"
    type: function
    constraints: "非主特征下整函数；主特征下在 s=1 有一阶极点"
  - name: "Gamma"
    meaning_zh: "Gamma 函数"
    type: function
    constraints: "阶乘的解析延拓"

domain_of_validity: "所有 s ∈ ℂ（非主特征）。等价写法：Λ(s,χ) = ε(χ)·Λ(1−s,χ̄)，其中 ε(χ) = τ(χ)/(i^a√q)，|ε(χ)| = 1。"

