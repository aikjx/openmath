caveat: >-
  1) 根数 ε(χ) 的**写法在文献里不唯一**：τ(χ)/(i^a√q)、i^a·τ(χ)/√q、τ(χ̄)/(i^a√q)、
     i^a·τ(χ̄)/√q、τ(χ)/√q 五种约定都见于不同著作。本记录不抄约定——验证脚本先把
     ε 作为 Λ(s,χ)/Λ(1−s,χ̄) **测出来**（并证它随采样点恒定、模为 1），再与五种候选比。
     测量结论：只有 τ(χ)/(i^a√q) 命中；i^a·τ(χ)/√q 在奇特征上差一个 −1（相对残差 ~1.42），
     τ(χ̄)/(i^a√q) 在复特征 χ₇ 上错成共轭（相对残差 ~3.89）。若日后有人把方程改写成
     上述任一种"看着差不多"的形式，那是**不同的命题**，不是同一句话的换记法。
  2) 模 5 的偶二次特征对「写哪种约定」**分辨力为零**（a=0 且实值时五种候选全等），
     脚本据此把它单独列为无分辨力样本，不参与约定判定。判定只由 χ₄、χ₃、χ₇ 三枚支撑。
  3) 大虚部处 Γ((1−s+a)/2) 指数衰减，Λ 的两端可小到 ~1e-34：此时**绝对残差**会把
     弱检验读成强检验。脚本对每条候选同时报绝对残差与相对残差（按 |Λ| 与 |εΛ'| 的大者归一），
     并印出该格最小尺度；判定用相对残差 < 1e-25。
  4) s = 0.25 + 100.0i 这一点在四个特征上都被**主动跳过**并逐次点名（|Λ(1−s,χ̄)| ≈ 1e-34 < 1e-20，
     比值不再是 ε 的可靠测量）。跳过数与跳过理由同印，不做无名的"−1 个点"。
  5) 主特征 χ₀（含 q=1 的 Riemann 情形）在 s=1 有极点，本记录的 Hurwitz 检验路线不覆盖；
     OM-F-AN-0002 用 mpmath.zeta（内置解析延拓）覆盖 ζ 的那一支。

