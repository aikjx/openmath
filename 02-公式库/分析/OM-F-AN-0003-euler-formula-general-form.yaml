      max_abs_residual: "9.23e-50"
      script: 08-工具/examples/verify_OM-F-AN-0003.py
      last_run: 2026-10-11
      note: >-
        PASS 只表示脚本现印的 52 项检查（e^{i theta} 24 个确定性采样角：pi 的有理倍数 12 点 + sqrt(m) 12 点；
        一般形式 12 点；de Moivre 9 点；n 次单位根 4 组；同态性 3 点）全部落在容差 1e-40 内，
        不表示公式成立，更不表示本库有任何进展（红线一）。采样不用随机数，故 seed 无实际语义。
    L3:
      passed: true
      engine: sympy
      method: "simplify(exp(x + I*y) - exp(x)*(cos(y) + I*sin(y))) == 0 与 simplify(exp(I*t) - (cos(t) + I*sin(t))) == 0（t 为实符号）"
      script: 08-工具/examples/verify_OM-F-AN-0003.py
      last_run: 2026-10-11
