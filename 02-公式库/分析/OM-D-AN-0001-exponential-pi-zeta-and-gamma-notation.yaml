statement_latex: '\exp(z)=\sum_{n=0}^{\infty}z^{n}/n!\ (z\in\mathbb{C}),\qquad \zeta(s)=\sum_{n\ge 1}n^{-s}\ (\operatorname{Re}s>1),\qquad \Gamma(s)=\int_{0}^{\infty}t^{s-1}e^{-t}\,dt\ (\operatorname{Re}s>0)'
proposed_by: 'Leonhard Euler'
proposed_year: 1748

assumptions:
  - 'exp 由级数定义，故它是整函数；对数式的多值性不在本卡口径内（OM-F-AN-0003 的一般形式讨论的正是这一层的商结构）'
  - 'zeta 与 Gamma 都取其**亚纯延拓**为默认对象，级数与积分只在各半平面给出生长式'
  - 'pi 取圆周长与直径之比，等价地取 2 倍 sin 的最小正零点；本卡不引入弧度制的额外约定'
symbols:
  - name: 'exp'
    meaning_zh: '复指数函数：整函数 z 映射到级数 sum z^n/n!'
    type: other
  - name: 'pi'
    meaning_zh: '圆周率：圆周长与直径之比，即 2 倍 sin 的最小正零点'
    type: other
  - name: 'zeta'
    meaning_zh: 'Riemann zeta 函数：Re s>1 上由 Dirichlet 级数给出，取其亚纯延拓'
    type: other
  - name: 'Gamma'
    meaning_zh: 'Gamma 函数：Re s>0 上由 Euler 积分给出，取其亚纯延拓'
    type: other

