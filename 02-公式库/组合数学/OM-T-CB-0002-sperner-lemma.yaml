statement_latex: '\text{满足 Sperner 标号条件的 }d\text{-单纯剖分中，全标号 }d\text{-单形的个数}\ \equiv\ 1\ (\mathrm{mod}\ 2)'
hypotheses:
  - '单纯形的 d+1 个顶点标号取自 \{0,1,\dots,d\} 且遵守边界约束'
  - '剖分为有限单纯剖分'
proposed_by: 'Emanuel Sperner'
proposed_year: 1928

assumptions:
  - '按模 2 计数，故结论是奇数而非某个具体数'
symbols:
  - name: 'd'
    meaning_zh: '单纯形的维数；本卡刻意不写 n，因为 n 在 NT 各卡已指大数参数'
    type: other

