caveat: '本条是 OM-T-TG-0001 的 uses 上游；把这条链记进图里，是为了让 02 图上能看见「组合⇒拓扑」这类跨域依赖，而不是只在散文里说。记号一侧：本卡的 d 与 Ramsey 卡的四个记号同属一笔债，落在 UNDEFINED_SYMBOL 账上。'

