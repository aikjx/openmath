statement_latex: '\forall r,k\ \exists R=R_r(k):\ K_R\ \text{的任意}\ r\text{-边着色含单色}\ K_k'
hypotheses:
  - '着色取任意 r 种颜色，不加任何约束'
  - 'R_r(k) 为满足条件的最小整数'
proposed_by: 'Frank P. Ramsey'
proposed_year: 1930

assumptions:
  - '图取完全图 K_n，边着色为任意映射'
symbols:
  - name: 'r'
    meaning_zh: '颜色数'
    type: other
  - name: 'k'
    meaning_zh: '要求的单色完全子图的顶点数'
    type: other
  - name: 'R_r(k)'
    meaning_zh: 'Ramsey 数，即保证单色 K_k 的最小顶点数'
    type: other
  - name: 'K_n'
    meaning_zh: 'n 个顶点的完全图'
    type: other

