statement_latex: '\mu(X)<\infty,\ g:X\to X\ \text{保}\ \mu\ \text{测度}\ \Longrightarrow\ \mu\text{-a.e.}\ x\in\mathcal{A}\ \exists n\ge 1:\ g^{n}x\in\mathcal{A}'
hypotheses:
  - 'X 带有限测度 \mu'
  - 'g 可逆且保 \mu 测度'
  - '\mathcal{A} 为可测集'
proposed_by: 'Henri Poincare'
proposed_year: 1890

assumptions:
  - '「回归」指几乎每个 \mathcal{A} 中的点会无穷多次回到 \mathcal{A}，本卡按无穷多次口径写'
symbols:
  - name: '\mu'
    meaning_zh: '有限测度（记号由 OM-D-PR-0001 定义）'
    type: other
  - name: 'g'
    meaning_zh: '保持测度的可逆变换；刻意不写 T——T 在 OM-D-FD-0002 已指一个形式理论'
    type: other
  - name: '\mathcal{A}'
    meaning_zh: '所考察的可测集（同一记号由 OM-D-PR-0001 定义）'
    type: other

