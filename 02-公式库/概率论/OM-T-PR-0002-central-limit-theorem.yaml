implications: []
contradicts: []
generalizations: []
specializations: []
caveat: '与 OM-T-PR-0001 记 related（同一对象的两种收敛口径），刻意不记 implies：两条定理互不蕴含。来源一侧本轮删掉了「Levy, Theorie des additions aleatoires」那一行：它的年份（1923 还是 1937）本轮无法核对，与其留一个会被引用的错年份，不如只站得住的部分。'

