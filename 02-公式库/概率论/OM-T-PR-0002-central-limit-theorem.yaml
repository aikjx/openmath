statement_latex: '\frac{\sqrt{n}\,(\bar{X}_n-\mathbb{E}[X_1])}{\sigma}\ \xrightarrow{\ d\ }\ \mathcal{N}(0,1)'
hypotheses:
  - 'X_i 独立同分布'
  - '\sigma^{2}=\operatorname{Var}(X_1) 存在且 0<\sigma^{2}<\infty'
proposed_by: 'Jarne Lindeberg'
proposed_year: 1922

assumptions:
  - '收敛指分布函数在连续点处逐点收敛（弱收敛）'
symbols:
  - name: '\bar{X}_n'
    meaning_zh: '样本均值；\mathbb{E}、\sigma、\xrightarrow{\ d\ } 三个记号由 OM-D-PR-0001 定义'
    type: other
  - name: '\mathcal{N}'
    meaning_zh: '\mathcal{N}(0,1) 指标准化正态律'
    type: other

related:
  - 'OM-T-PR-0001'
uses:
