statement_latex: '\bar{X}_n=\frac{1}{n}\sum_{i=1}^{n}X_i\ \longrightarrow\ \mathbb{E}[X_1]\quad a.s.'
hypotheses:
  - 'X_i 独立同分布'
  - '\mathbb{E}[|X_1|]<\infty（一阶矩存在即可，这是 Kolmogorov 版）'
proposed_by: 'Andrey Kolmogorov'
proposed_year: 1930

assumptions:
  - '概率空间足够承载无限序列（存在性由标准构造给出）'
symbols:
  - name: 'X_i'
    meaning_zh: '第 i 个随机变量'
    type: other
  - name: '\bar{X}_n'
    meaning_zh: '前 n 项的样本均值'
    type: other
  - name: '\mathbb{E}'
    meaning_zh: '期望'
    type: other
  - name: 'a.s.'
    meaning_zh: '几乎必然（概率 1 的事件上成立）'
    type: other

