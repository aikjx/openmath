statement_latex: '\mathcal{N}(\mu,\sigma^{2})\ \text{的密度}=(2\pi\sigma^{2})^{-1/2}\exp\!\bigl(-(x-\mu)^{2}/(2\sigma^{2})\bigr),\qquad \mathcal{N}(0,1)\ \text{为标准化}'

assumptions:
  - 'sigma^{2}>0；退化情形（sigma=0，点质量）不写 \mathcal{N}，另按分布退化处理'
  - '\xrightarrow{\ d\ } 表示依分布收敛，其口径在 OM-D-PR-0001 的概率空间记号里'
  - '本卡按密度函数定义 \mathcal{N}，故只对绝对连续律成立'
symbols:
  - name: '\mathcal{N}'
    meaning_zh: '\mathcal{N}(\mu,\sigma^{2}) 指均值为 mu、方差为 sigma^2 的正态律；\mathcal{N}(0,1) 为标准化正态律'
    type: other

