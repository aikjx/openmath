statement_latex: 'f:\overline{B}^{\,n}\to\overline{B}^{\,n}\ \text{连续}\ \Longrightarrow\ \exists x\in\overline{B}^{\,n}:\ f(x)=x'
hypotheses:
  - '定义域是闭单位球（同胚于任意紧凸集）'
  - 'f 连续，不需要可微'
proposed_by: 'L. E. J. Brouwer'
proposed_year: 1912

assumptions:
  - 'n>=1；n=0 时结论退化为平凡情形'
symbols:
  - name: 'f'
    meaning_zh: '闭球上的连续自映射（记号由 OM-D-TG-0001 定义）'
    type: other
  - name: '\overline{B}^{\,n}'
    meaning_zh: '闭单位球（同上）'
    type: other
  - name: 'x'
    meaning_zh: '所求的不动点'
    type: other

related:
  - 'OM-T-TG-0003'
  - 'OM-D-TG-0001'
uses:
