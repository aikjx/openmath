id: OM-T-TG-0003
kind: theorem
title_zh: '角谷不动点定理'
title_en: 'Kakutani fixed-point theorem'
domain: TG
msc:
  - '55M20'
tags:
  - '不动点'
  - '集值映射'
  - '上半连续'

status: PROPOSED
