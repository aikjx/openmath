created: 2026-10-11
updated: 2026-10-11

statement_latex: '\Phi:K\multimap K,\ \text{上半连续、值非空凸闭}\ \Longrightarrow\ \exists x\in K:\ x\in\Phi(x)'
hypotheses:
  - 'K 为 R^n 中的非空紧凸集'
  - '集值映射上半连续'
  - '每个值都是非空凸闭集'
proposed_by: 'Shizuo Kakutani'
proposed_year: 1941

assumptions:
  - '「不动点」在这里指 x 属于像集 \Phi(x)，而不是 \Phi(x) 是单点'
symbols:
  - name: 'K'
    meaning_zh: '非空紧凸集（记号由 OM-D-TG-0002 定义）'
    type: other
  - name: '\Phi'
    meaning_zh: '集值映射（correspondence）；本卡刻意不写 \varphi——\varphi 已被 OM-D-AL-0001 与 OM-D-FD-0001／0002 用作同态与公式变元'
    type: other
  - name: '\multimap'
    meaning_zh: '集值映射记号（同上）'
    type: other

