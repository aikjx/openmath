updated: 2026-10-11

statement_latex: 'K\subseteq\mathbb{R}^{n}\ \text{紧凸},\quad \Phi:K\multimap K,\qquad x_k\to x,\ y_k\in\Phi(x_k),\ y_k\to y\ \Longrightarrow\ y\in\Phi(x)'
hypotheses:
  - 'K 非空、紧、凸'
  - '集值映射 \Phi 的每个值都非空、凸、闭'

assumptions:
  - '\Phi:K\multimap K 读成 \Phi 把每个 x 送到 \mathcal{P}(K) 的一个非空成员；上半连续在本卡按「闭图＋K 紧」这一口径给出，与图闭性同读'
symbols:
  - name: 'K'
    meaning_zh: 'R^n 中的非空紧凸集（角谷卡与 Nash 卡的定义域）'
    type: other
  - name: '\Phi'
    meaning_zh: '集值映射（correspondence）：像 \Phi(x) 是一个集合而非一个点'
    type: other
  - name: '\multimap'
    meaning_zh: '集值映射记号'
    type: other
  - name: '\mathcal{P}'
    meaning_zh: '幂集记号：\mathcal{P}(S) 是 S 的一切子集之族'
    type: other

