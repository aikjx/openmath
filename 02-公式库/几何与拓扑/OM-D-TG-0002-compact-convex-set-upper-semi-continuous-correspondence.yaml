id: OM-D-TG-0002
kind: definition
title_zh: '紧凸集与上半连续的集值映射'
title_en: 'Compact convex set and upper semicontinuous correspondence'
domain: TG
msc:
  - '52A41'
  - '54A10'
tags:
  - '凸集'
  - '紧集'
  - '集值映射'
  - '上半连续'

status: PROPOSED
evidence_level: L1
revision: 1
