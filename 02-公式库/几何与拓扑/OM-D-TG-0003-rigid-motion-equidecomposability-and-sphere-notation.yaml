statement_latex: 'S^{2}=\{x\in\mathbb{R}^{3}:\ \|x\|=1\},\qquad SO(3)=\{A\in\mathrm{GL}_3(\mathbb{R}):\ A^{\mathsf{T}}A=I,\ \det A=1\},\qquad A\sim B\iff A=\textstyle\bigcup_i A_i,\ B=\textstyle\bigcup_i g_iA_i,\ g_i\in SO(3)'

assumptions:
  - '分块为**有限**分块且各块互不相交（并集取不相交并）'
  - '等分等价只问刚体运动（旋转加平移），本卡的 SO(3) 只写旋转部分；平移部分在分球定理的论证里由自由群生成元承担'
  - 'S^{2} 取三维空间中的单位球面（二维曲面，不含内部）'
symbols:
  - name: 'S^{2}'
    meaning_zh: '三维空间中的单位球面，即到原点距离为 1 的点集'
    type: other
  - name: 'SO(3)'
    meaning_zh: '三维旋转群：正交且行列式为 1 的 3x3 实矩阵全体'
    type: other
  - name: '\sim'
    meaning_zh: '等分等价记号：A 有限分块后经刚体运动重排成 B'
    type: other
  - name: '\mathrm{vol}'
    meaning_zh: 'OM-C-TG-0001 所设想的体积记号：定义在 R^3 一切子集上、刚体运动不变且可数可加；该对象由 OM-T-TG-0002 判为不存在'
    type: other

