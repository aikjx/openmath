statement_latex: '\varphi:G\to H,\quad \ker\varphi=\{g\in G:\varphi(g)=e_H\}\trianglelefteq G,\quad \mathrm{im}\,\varphi=\varphi(G)\le H'

assumptions:
  - '乘法记法的群；核必须是正规子群，否则商集上没有良好定义的运算'
  - '环的情形核换成双边理想，本卡只登记群的语言'
