    meaning_zh: '核'
    type: other
  - name: 'im'
    meaning_zh: '像'
    type: other
  - name: 'trianglelefteq'
    meaning_zh: '正规子群记号'
    type: other
  - name: 'cong'
    meaning_zh: '同构记号（两个结构之间存在同构）'
    type: other

