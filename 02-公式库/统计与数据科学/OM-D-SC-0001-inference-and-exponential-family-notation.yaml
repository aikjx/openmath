statement_latex: 'score(theta) = (d/d theta) log p(X; theta), I_1(theta) = E_theta[score^2] = -(d^2/d theta^2) log p, I_n(theta) = n * I_1(theta) (i.i.d.), p(x; eta) = exp(eta * T(x) - A(eta)), eta = log(q / (1 - q))'

assumptions:
  - '记号只在「支配模型 {p(.;theta), theta 属于 Theta}＋求导与积分可交换（正则条件）」这一语境里有意义；本卡只固定记号，不判定哪些模型满足该交换律'
  - 'A(eta) 是对数配分函数（log-partition），其自然参数化下的曲率 d^2A/d eta^2 就是该族在 eta 坐标里的 Fisher 信息；本卡不引入任何关于 A 的界'
  - '索引 n 记观测个数、theta 记被微分的那个参数：I(theta) 与 I_n(theta) 是两个量，n=1 时同值，不许混写'
symbols:
  - name: 'score'
    meaning_zh: '得分函数 score(theta)＝(d/d theta) log p(X; theta)：对数似然对被估参数的一阶导；正则条件下 E_theta[score]＝0，故 Fisher 信息可写成它的二阶矩'
    type: other
  - name: 'I_n'
    meaning_zh: 'n 次独立观测的 Fisher 信息 I_n(theta)＝sum_{i=1..n} E_theta[score_i^2]；i.i.d. 时 I_n＝n·I_1，故 Cramer–Rao 下界里的分母按 n 缩放（OM-T-SC-0001 的机器读数取 n=1 与 n=3 两档）'
    type: other
  - name: 'eta'
    meaning_zh: '自然参数（canonical parameter）eta：指数族写成 p(x; eta)＝exp(eta·T(x) − A(eta)) 时的那个坐标；二项族的例子是 eta＝log(q/(1−q))，把 q 坐标换到 eta 坐标要靠 dq/deta 换算 Fisher 信息'
    type: other

