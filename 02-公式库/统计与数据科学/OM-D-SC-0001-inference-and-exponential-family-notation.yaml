caveat: '第 13 批记号卡：把 OM-T-SC-0001 用到的 3 枚结构名（score、I_n、eta）升成定义条目，符号账因此回到版面改前那一格（净涨 0，按第 4 批裁定「结构名铸、裸字母不铸」）。本卡不新增任何数学主张，只固定记号与口径：theta、sigma、q、m、T 五枚裸字母按同一裁定留在名单外，不进本卡的 symbols。'

