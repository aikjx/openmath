schema_version: "0.1"

id: OM-T-SC-0002
kind: theorem
title_zh: 'Fisher 信息的可加性：独立观测把信息相加，自然指数族把它读成对数配分的曲率'
title_en: 'Additivity of Fisher information and the natural exponential family curvature identity'
domain: SC
msc:
  - '62F03'
  - '62B10'
tags:
  - 'Fisher 信息'
  - '可加性'
  - '自然参数'
  - '对数配分函数'
  - '重参数化律'

status: VERIFIED(L2)
evidence_level: L2
revision: 1
created: 2026-10-18
updated: 2026-10-18

statement_latex: >-
  X_1,…,X_n 相互独立且各自的得分函数为 u_i(θ)=∂ log p_i(X_i;θ)/∂θ 时，联合得分 u=Σ u_i，
  且 I_n(θ)=Σ I_i(θ)（i.i.d. 时 I_n=n·I_1）；自然指数族 p(x;η)=h(x)exp(η T(x)-A(η)) 满足
  E_η[T]=A′(η)、I(η)=Var_η(T)=A″(η)；一般重参数化下 I(η)=I(θ)(dθ/dη)²。
hypotheses:
  - '各观测相互独立，且每个分量族满足 OM-T-SC-0001 所列的正则条件（积分与对 θ 求导可交换）'
  - '各分量的 Fisher 信息存在且有限；求和族的对数配分 A(η) 关于 η 二次可微（即 A 是凸的可微生成函数）'
  - 'T(x) 的支撑不依赖于参数（指数族正则形式），故 E_η[T]=A′(η) 可由配分函数求导得到'
proposed_by: 'R. A. Fisher（1925 年论文给出信息量与可加性；指数族的曲率表述是其后的标准形态）'
proposed_year: 1925

latex: >-
  I_n(θ) = Σ I_i(θ),  I(η) = Var_η(T) = A″(η),  I(η) = I(θ)·(dθ/dη)²
sympy: '((1-q)*(1/(1-q))**2 + q*(1/q)**2 - 1/(q*(1-q)))**2 + ((1-q)**2*(2/(1-q))**2 + q**2*(2/q)**2 + 2*q*(1-q)*(1/q-1/(1-q))**2 - 2/(q*(1-q)))**2 + ((1-q)**2*(2/(1-q))**2 + q**2*(2/q)**2 + 2*q*(1-q)*(1/q-1/(1-q))**2 - 2*((1-q)*(1/(1-q))**2 + q*(1/q)**2))**2 + (summation(binomial(3,k)*q**k*(1-q)**(3-k)*(k/q-(3-k)/(1-q))**2,(k,0,3)) - 3/(q*(1-q)))**2 + (summation(binomial(3,k)*q**k*(1-q)**(3-k)*(k/q-(3-k)/(1-q)),(k,0,3)))**2 + (diff(log(1+exp(eta)),(eta,2)).subs(eta,log(q/(1-q))) - q*(1-q))**2 + (diff(3*log(1+exp(eta)),(eta,2)).subs(eta,log(q/(1-q))) - 3*q*(1-q))**2 + (1/(q*(1-q))/diff(log(q/(1-q)),q)**2 - q*(1-q))**2 + (summation(exp(-lam)*lam**x/factorial(x)*(x-lam)**2,(x,0,oo)) - lam)**2 + (summation(exp(-lam)*lam**x/factorial(x)*(x/lam-1)**2,(x,0,oo)) - 1/lam)**2 + ((x1-theta)/sd1**2 + (x2-theta)/sd2**2 - (1/sd1**2+1/sd2**2)*((x1/sd1**2+x2/sd2**2)/(1/sd1**2+1/sd2**2)-theta))**2'

assumptions:
  - '本卡机器读数（sympy 字段）覆盖的是「一条平方和里的 11 项恒等式」，不是任意独立族：离散侧取 Bernoulli 一枚与两枚乘积测度（四个原子显式枚举，不走闭式）、Bin(3,q) 的求和通道；连续侧只进「等号条件恒等式」那一项（它不含积分，逐点成立），故积分形状的可加性由脚本的精确有理通道承担'
  - 'Poisson 两项（自然坐标与 lam 坐标）由 sympy 的无穷求和给出解析闭式；这一型在 float 代入下仍返回闭式，因此可以进机器读数，但它的闭式出自符号机而不是数值求积（红线一）'
  - 'Fubini 分解后的连续可加性（单积分乘积）不进 sympy 字段是**成本**取舍，不是算不出来：通用引擎口径（float 代入＋sp.N(50)）下单枚采样点 40.4 秒、残差 -9.126e-52（scratch/T14_PROTO3_face.txt 的 cost 段；第二台独立计时 69.9 秒、残差同为 9.1260e-52，见 scratch/T14_CALIBER_probe.txt），而字段里那 11 项合计只要 6.7 秒（同一张 PROTO3 面的 REC_TOTAL 行）。本脚本走精确有理通道，同一枚点核对三条通道耗时 237.1 秒（CALIBER 面末行）；把 .doit() 提到 simplify 之前可 0.4 秒归约为 0（同一张面），本卡没有那样装配——代点前先 doit 会撞进 sympy 的 meijerint 内部 KeyError（文件头记过），代点后 doit 是未付的仪器杠杆'
  - '同一批积分若**不做 Fubini 分解**（嵌套双重积分原形），在引擎口径下 0.0 秒返回未归约的 Integral（scratch/T14_PROTO3_face.txt）——它不报错，而是能被 sp.N 退化成一个数当残差印，所以脚本 ex() 的形状守卫必须抛（η-参数化 Poisson 一阶矩曾给出 -1.4185 而真值 0）'
  - '等号条件那一项是「score = I·(T−θ)」的逐点恒等式：它对任意 (x1,x2,θ,σ1,σ2) 成立，所以本卡的连续侧证据是代数形状而不是积分值'
symbols:
  - name: 'I_n'
    meaning_zh: 'n 枚独立观测合并后的 Fisher 信息'
    type: real
    constraints: '可加性 I_n=Σ I_i；i.i.d. 时＝n·I_1；本卡机器读数取 n=1、2（枚举立方）、3（Bin 求和）三处'
  - name: 'A'
    meaning_zh: '自然指数族的对数配分函数（cumulant generating 的一侧）'
    type: real
    constraints: 'A(η)=log ∫h(x)e^{ηT(x)}dx；本卡机器读数用 Bernoulli 的 log(1+e^η) 与 Poisson 的 e^η；求和族的 A 相加，故 A″ 相加'
  - name: 'eta'
    meaning_zh: '自然参数'
    type: real
    constraints: 'Bernoulli 取 log(q/(1-q))，Poisson 取 log(lam)；机器读数里它已被 .subs 代掉，不作为采样点自由符号'
  - name: 'q'
    meaning_zh: 'Bernoulli／二项族的成功概率'
    type: real
    constraints: '0<q<1；机器读数用 2/5 与 1/3'
  - name: 'lam'
    meaning_zh: 'Poisson 族的均值参数'
    type: real
    constraints: '>0；机器读数用 7/4 与 2'
  - name: 'theta'
    meaning_zh: '两个正规分量共有的均值（被估参数）'
    type: real
    constraints: 'σ1、σ2 视为已知且不相等（本卡读数取 3/2 与 5/3、2 与 3）'
  - name: 'sd1'
    meaning_zh: '第一枚正规分量的标准差'
    type: real
    constraints: '取正有理数；它与 sd2 不相等，否则「逆方差加权」退化成算术平均，本卡的可加性读数失去分辨力'
  - name: 'sd2'
    meaning_zh: '第二枚正规分量的标准差'
    type: real
    constraints: '取正有理数'
  - name: 'x1'
    meaning_zh: '第一枚正规分量的观测值'
    type: real
    constraints: '等号条件那一项对 x1 逐点成立；机器读数钉 5/7 与 -1'
  - name: 'x2'
    meaning_zh: '第二枚正规分量的观测值'
    type: real
    constraints: '机器读数钉 -3/4 与 8/5'

domain_of_validity: '有限枚相互独立的正则观测；本卡的机器读数只覆盖上条 assumptions 点名的族与采样点，不含相依情形（相依时可加性一般不成立，交叉项不为零）'

equivalent_forms:
  - '可加性的两条同义写法：I_n(θ)=Σ I_i(θ)（得分二阶矩可加，因交叉项 E[u_i u_j]=E[u_i]E[u_j]=0）＝求和族的对数配分相加 A_{Σ}=Σ A_i 时其曲率相加（自然坐标下）'
  - '自然指数族三条恒等式串成一条：E_η[T]=A′(η)、Var_η(T)=A″(η)、I(η)=Var_η(T)，故「信息＝对数配分的曲率」；本卡把它落成 Bernoulli 与 Poisson 两族的机器读数'
  - '重参数化律：I(η)=I(θ)(dθ/dη)²。二项／Bernoulli 读数 I(q)=1/(q(1-q)) 与 A″(η)=q(1-q) 由 dq/dη=q(1-q) 互推；位置族读数 I(θ)=1/σ² 与 I(η)=σ²（η=θ/σ²）同一把尺'
  - '达到界的一侧（与 OM-T-SC-0001 的等号条件同尺）：T=（x1/σ1²+x2/σ2²)/(1/σ1²+1/σ2²) 使 score=I_2·(T−θ) 逐点成立，故 Var(T)=1/I_2=1/(1/σ1²+1/σ2²)——「信息相加」在估计侧读作「精度相加」'
  - '不达到界的一侧（反对照）：算术平均 (x1+x2)/2 在 σ1≠σ2 时 Var−界=(σ1−σ2)²/4·(…)>0（数值由载体 scratch/T14_SC0002_face.txt 判定3b 印出），等号条件可解性残差非零'

