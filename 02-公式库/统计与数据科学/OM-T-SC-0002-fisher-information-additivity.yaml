caveat: >-
  本卡不重做证明，也不声明任何新结果（红线一、红线八）。它做的是三件更窄的事：
  ①把「可加性」拆成两条独立生产者——离散侧显式枚举四个原子（不用任何闭式）与二项求和通道，
  连续侧用 Fubini 分解后的单积分乘积与嵌套双重积分（精确有理），两条同值才计一次数；
  ②把「信息＝曲率」落到两族（Bernoulli、Poisson）并额外核对求和族的曲率相加，
  使「A 相加」与「I 相加」被同一条尺子读；
  ③给「精度相加」装上双向判别：同一把等号条件的尺在逆方差加权判可及、在算术平均判不可及，
  且与「方差减界」那条通道同判——只有一边红一边绿才说明这把尺会判，全绿不算证据。
  另须记住：Poisson 两项的闭式出自 sympy 的无穷求和，Fubini 那条连续通道只在精确有理代入下被核对
  （引擎口径下同一条单枚采样点要 40.4 秒，见 assumptions 与 scratch/T14_PROTO3_face.txt，故不进机器读数）；
  把这些当数值证据时，它们出自符号机。

