schema_version: "0.1"

id: OM-T-SC-0001
kind: theorem
title_zh: 'Cramér–Rao 不等式：Fisher 信息、等号条件与三个可算族'
title_en: 'Cramér–Rao inequality'
domain: SC
msc:
  - '62F03'
  - '62B10'
tags:
  - 'Fisher 信息'
  - '无偏估计'
  - '方差下界'
  - '等号条件'

status: VERIFIED(L2)
evidence_level: L2
revision: 1
created: 2026-10-18
updated: 2026-10-18

statement_latex: >-
  Var_θ(T) ≥ (d g(θ)/dθ)² / I_n(θ), 其中 I_n(θ) = E_θ[score²] = -E_θ[∂² log p(X;θ)/∂θ²],
  score = ∂ log p/∂θ, 且 E_θ[T] = g(θ)。
hypotheses:
  - '族 {p(x;θ)} 关于 θ 二次可微，且积分与对 θ 求导可交换（正则条件）'
  - 'I_n(θ) 存在、为正，并在 θ 的邻域内一致有界'
  - 'T 是 g(θ) 的无偏估计，E_θ[T]=g(θ)，且 Var_θ(T) 有限'
proposed_by: 'Harald Cramér（1946 年专著）；单参数情形由 C. R. Rao（1945）先行给出'
proposed_year: 1946

latex: >-
  Var_θ(T) ≥ (g′(θ))² / I_n(θ)
sympy: '(summation(binomial(5,k)*q**k*(1-q)**(5-k)*diff(log(binomial(5,k)*q**k*(1-q)**(5-k)),q)**2,(k,0,5)) - 5/(q*(1-q)))**2 + (summation(binomial(5,k)*q**k*(1-q)**(5-k)*diff(log(binomial(5,k)*q**k*(1-q)**(5-k)),q),(k,0,5)))**2 + (summation(binomial(5,k)*q**k*(1-q)**(5-k),(k,0,5)) - 1)**2 + (diff(-(x1-theta)**2/(2*sigma**2)-(x2-theta)**2/(2*sigma**2)-(x3-theta)**2/(2*sigma**2),theta) - 3/sigma**2*((x1+x2+x3)/3-theta))**2 + (Integral(exp(-(x-theta)**2/(2*sigma**2))/(sigma*sqrt(2*pi))*((x-theta)/sigma**2)**2,(x,-oo,oo)) - 1/sigma**2)**2'

assumptions:
  - '本卡的机器读数只覆盖三个具体族（二项 Bin(5,q)、正规位置族 N(θ,σ²)、正规尺度族 N(0,σ²)），不是任意正则族'
  - '通用引擎的残差是一条 sympy 表达式，故每个采样点必须钉住它的全部自由符号（q、x1、x2、x3、theta、sigma），少钉一个就整条判 UNKNOWN'
  - '等号条件按 score = a(θ)·(T − g(θ)) 的可解性判：a 由一枚采样点解出后代回其余采样点，残差非零即判「不可及」'
symbols:
  - name: 'I_n'
    meaning_zh: 'n 次独立观测的 Fisher 信息'
    type: real
    constraints: 'i.i.d. 时 I_n = n·I_1；本卡机器读数取 n=1 与 n=3 两处'
  - name: 'score'
    meaning_zh: '得分函数 ∂ log p(X;θ)/∂θ'
    type: real
    constraints: '正则条件下 E[score]=0，故 I=E[score²]=Var(score)'
  - name: 'T'
    meaning_zh: '被估量 g(θ) 的估计量'
    type: real
    constraints: '本卡要求无偏：E_θ[T]=g(θ)；三个实例分别取 T=x、T=x̄（n=3）、T=√(π/2)·|x|'
  - name: 'theta'
    meaning_zh: '位置族 N(θ,σ²) 里被估的均值'
    type: real
    constraints: 'σ 视为已知'
  - name: 'sigma'
    meaning_zh: '正规族的标准差'
    type: real
    constraints: '取正有理数；本卡读数用 5/2 与 3'
  - name: 'q'
    meaning_zh: '二项族 Bin(m,q) 的成功概率'
    type: real
    constraints: '0<q<1；机器读数用 2/5 与 1/3，脚本扫 15 组'
  - name: 'm'
    meaning_zh: '二项试验次数'
    type: integer
    constraints: '≥1；引擎残差式固定 m=5，脚本另扫 m∈{1,2,5,7,20}'
  - name: 'eta'
    meaning_zh: '二项族的自然参数 log(q/(1-q))'
    type: real
    constraints: '通道 B 走 A(eta)=m·log(1+e^eta) 的曲率 A″(eta)'

domain_of_validity: '单参数正则族；本卡的机器读数只覆盖上条 assumptions 点名的三族与采样点'

equivalent_forms:
  - '两条 Fisher 恒等式：I(θ)=E_θ[score²]（得分二阶矩）＝ -E_θ[∂² log p/∂θ²]（期望负曲率）'
  - '等号条件：Var(T)=(g′)²/I 达到 ⟺ 存在 a(θ) 使 score = a(θ)·(T − g(θ)) 几乎处处成立'
  - '位置族读数：I(θ)=1/σ²，T=x 时 Var(T)=σ²=1/I(θ)，等号成立；等号条件的系数 a 恰为 1/σ²'
  - '尺度族读数：I(σ)=2/σ²，T=√(π/2)·|x| 对 σ 无偏，但 Var(T)/界 = π−2 = 1.14159265359，超出 14.159265%（载体 scratch/T13_SC0001_face.txt 判定3b）'
  - '二项族读数：I(q)=m/(q(1−q))＝A″(η)/(dq/dη)²，η=log(q/(1−q))，两条通道在 15 组 (m,q) 上差的最大值 2.7369111e-48（同一载体判定1b）'

