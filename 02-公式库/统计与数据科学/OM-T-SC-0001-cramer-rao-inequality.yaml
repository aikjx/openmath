caveat: >-
  本卡不重做证明，也不声明任何新结果（红线一、红线八）。它做的是两件更窄的事：
  ①把「文档里印出的公式」与「机器实际微分/积分的对象」绑成同一条残差——
  若记号写错（例如把位置族的 I(θ) 写成 1/σ，或把二项 Fisher 写成 m·q(1−q)＝A″(η)），
  残差立刻非零，这由脚本 --selftest 的四枚变异体现场演示（载体 scratch/T13_SC0001_selftest.txt）。
  ②给「等号条件」装上判别力：同一把尺在位置族判可及、在尺度族判不可及，
  且与「方差减界」那条独立通道同判——只有一边红一边绿才说明这把尺会判，全绿不算证据。
  另须记住：位置族与尺度族的积分残差出自 sympy 的解析闭式（可恰为 0），
  判定4 的 mpmath 数值求积才是同批积分的第二口径；把前者当数值证据时它出自符号机。

