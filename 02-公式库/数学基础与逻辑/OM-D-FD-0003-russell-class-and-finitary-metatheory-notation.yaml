statement_latex: '\mathcal{R}=\{x:x\notin x\},\qquad \mathrm{F}\ \text{为有穷数学（finiter Mathematik），}\ \mathrm{F}\vdash\mathrm{Con}(T)\ \text{指在}\ \mathrm{F}\ \text{内给出一致性证明}'

assumptions:
  - '\mathcal{R} 按朴素概括原则写成类；本卡不断言它是集合（它不是，这正是 OM-X-FD-0001）'
  - 'F 的具体刻度由希尔伯特纲领的选择决定（原始递归、有穷算术 PRA 等），本卡只固定记号并写明「不固定刻度则 Con 的陈述不唯一」这一层'
  - 'Con(T) 与 Proof_T 的记号口径在 OM-D-FD-0002，本卡不重复定义'
symbols:
  - name: '\mathcal{R}'
    meaning_zh: '所有不自属的集合构成的类（罗素类）'
    type: other
  - name: '\mathrm{F}'
    meaning_zh: '有穷数学（finiter Mathematik）：希尔伯特纲领指定的元理论系统'
    type: other

