statement_latex: '\mathrm{Con}(T)\ \Rightarrow\ \exists G\ \bigl(T \nvdash G\ \wedge\ T \nvdash \neg G\bigr)'
hypotheses:
  - 'T 一致（原始证明需 ω-一致，Rosser 改版只需一致）'
  - 'T 递归可公理化（公理集可有效枚举）'
  - 'T 足以表示初等算术（每个原始递归函数在 T 中可表示）'
proposed_by: 'Kurt Godel'
proposed_year: 1931

assumptions:
  - '语言可有效编码（Gödel 配对）'
  - 'T 的证明关系是原始递归的'
symbols:
  - name: 'T'
    meaning_zh: '满足三条前提的形式理论'
    type: other
  - name: 'G'
    meaning_zh: 'T 中不可判定的句子的哥德尔句'
    type: other

