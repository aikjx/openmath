caveat: '与 OM-P-FD-0001 的冲突是**单向否证**关系，但按本库的对称记账规矩，两边都写了 contradicts：希尔伯特纲领一侧若只留一个「被否证」的标签而不留冲突边，图上就看不见这条边从纲领出发。'

