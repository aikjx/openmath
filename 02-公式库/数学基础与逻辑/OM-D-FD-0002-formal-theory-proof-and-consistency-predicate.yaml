statement_latex: '\mathrm{Proof}_T(p,\ \ulcorner\varphi\urcorner)\ \Longleftrightarrow\ p\ \text{是}\ T\ \text{中}\ \varphi\ \text{的一个证明编码}'

assumptions:
  - '语言与符号表可有效枚举，故句子可配 Gödel 码 ulcorner-varphi'
  - 'Proof_T 取原始递归（甚至 Δ0）的证明谓词，T 的公理集可判定或递归可枚举'
symbols:
  - name: 'T'
    meaning_zh: '递归可公理化的形式理论'
    type: other
  - name: 'p'
    meaning_zh: '证明的编码（哥德尔数）'
    type: other
  - name: 'Proof_T'
    meaning_zh: 'T 的证明关系，写成算术语言里的谓词'
    type: other
  - name: 'varphi'
    meaning_zh: '语言中的句子'
    type: other
  - name: 'ulcorner'
    meaning_zh: '配码符 ulcorner-.-ulcorner'
    type: other
  - name: 'Con'
    meaning_zh: '一致性陈述，写作 not exists p Proof_T(p, ulcorner-0=1-ulcorner)'
    type: other

