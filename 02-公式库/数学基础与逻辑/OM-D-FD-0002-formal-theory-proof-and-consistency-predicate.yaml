caveat: '本条为第 1 批的 OM-T-FD-0001、OM-T-FD-0002 与 OM-P-FD-0001 补记号定义：三条记录都用了 T、Con、Proof_T，而本库把「记号无定义」记进 UNDEFINED_SYMBOL 台账。'

