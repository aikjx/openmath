caveat: >-
  本卡不重做证明，也不声明任何新结果（红线一、红线八）。它做的是三件更窄的事：
  ①把 M/M/1 的几何平稳量、细致平衡、Little 律家族与一枚指数尾积分拆成十枚通道，
  每条在两条独立通路上读——字符串路（写进 sympy 字段那一条，从盘上 YAML 读回）
  与对象路（脚本里用 sympy 对象重新拼一遍 pi_n、L_s、W_s、L_q），两路须同文且**各自**在两枚采样点上归零才计一次数；
  ②给「平稳」二字定价：判定 2 第一段只用四条细致平衡方程（不含任何归一化）现推 p_n = p_0*r^n，不借闭式——这是独立生产者；
  第二段把归一化换成 sum_{n<=4}p_n=1，现推出来的是**有限容量链**（r=1/2 时 16/31、8/31…），
  它必须与卡面的无限闭式（1/2、1/4…）不同值：两种归一化币种若读成同一个数，这一段就是抄表，
  电池 M4 把容量旋钮从 5 拧到 4 来测这把尺有没有牙；无限归一化本身因此只登记成可读形
  「前 K+1 项部分和与 1 之差恰为闭式余项 r^(K+1)」（K+1 由 r 与 1e-20 那把尺现推，本卡不判 |r|<1）；
  ③把「代数恒等式」与「概率陈述」分开登记并**明写前者对后者零分辨力**：
  判定 4 在 r=2 那格同时读到「十枚通道全零」与「pi_0=-1、尾项 -1.0995e+12」，
  所以引用本卡时不许把 L2 PASS 读成「本卡验证了稳定条件」。
  须记住：L_s 是平稳期望这一事实本身要遍历性论证，本卡未做成机器判据；
  M/M/c、M/G/1 与有限容量各需另卡。

