id: OM-T-OR-0001
kind: theorem
title_zh: 'M/M/1 的几何平稳量与 Little 律闭合形式：十枚代数通道逐条归零，而稳定条件 lambda_a<mu 不在这些通道里——它由 pi_0>0 与尾项衰减两枚控制读数承重'
title_en: 'Closed forms for the M/M/1 geometric stationary quantities and for the law L = lambda*W: ten algebraic channels vanish one by one, while the stability condition lambda_a < mu is not among them - it is carried by the two controls pi_0 > 0 and tail decay'
domain: OR
