title_en: 'Notation for the M/M/1 queue: arrival rate lambda_a, service rate mu, stationary probabilities pi_n, and the queue-length/waiting-time pair L_q/W_q (traffic intensity is written only as the quotient lambda_a/mu; this card does not take over the name rho)'
