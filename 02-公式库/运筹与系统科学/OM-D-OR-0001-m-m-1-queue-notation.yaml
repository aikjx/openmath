caveat: >-
  第 20 批记号卡：把 OM-T-OR-0001 用到的结构名升成定义条目，符号账不动（净涨 0）。
  铸卡前逐名量过主人（载体 scratch/T20_OR_probe.txt 的 S2 段，打在写卡之前）：
  lambda_a、mu、pi_n、L_q、W_q、W_s 六枚在现面 0 主人、0 在未定义名单上，
  所以本卡不会把任何人的账抹成「已定义」；同一把尺在 lam/k/n/q/s 上抓到主人或抓到账＝反对照通过，
  放宽排除集那一档由夹具抓到 T 被抹成 0 主人（摘除律自检 5 格）。
  本卡另外**主动不声明** 三枚名字（rho、裸 L/裸 W、lam），理由逐枚写在 assumptions 里并挂现读数——
  这是本卡的全部数学内容之外的东西，但它是符号账不被假绿污染的前提。
  本卡不新增任何数学主张，只固定记号与口径。

