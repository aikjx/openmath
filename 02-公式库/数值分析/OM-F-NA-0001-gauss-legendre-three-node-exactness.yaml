caveat: >-
  本卡不重做证明，也不声明任何新结果（红线一、红线八）。它做的是三件更窄的事：
  ①把「三点 Gauss 求积对不超过 5 次多项式精确」这条断言拆成六条按次数的通道，逐条在两条独立通路上读——
  字符串路（写进 sympy 字段的那一条）与对象路（脚本里用 sympy 对象重新拼一遍节点、权重与 Jacobian），
  两路逐格同值才计一次数；
  ②给「精确到 5 次」配上限证据：p=6、p=7 两格展开式必须非零，且反对照的取样不许只落在对称区间
  （p=7 在 lo=-1、hi=1 读成 0.000e+00 是奇函数的对消，会把一根没牙的反对照尺伪装成通过）；
  ③把三条正交通道的符号归零与六条精确性通道的数值归零分开登记，
  免得「sympy 把积分算成 0」被读成「本卡证明了 Gauss 定理」。
  须记住：精度阶恰为 2n-1 的一般 Gauss 定理不由本卡担保，本卡只读 n=3。

