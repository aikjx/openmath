revision: 1
created: 2026-10-19
updated: 2026-10-19

statement_latex: 'lo < hi 记积分区间端点；mid=(lo+hi)/2、half=(hi-lo)/2 记其中点与半长；xi_k = mid + half*g_k 记一般节点（g_k 为规范区间 [-1,1] 上的第 k 枚节点）；三点 Gauss–Legendre 的 xi_1、xi_2、xi_3 即 g = -sqrt(3/5)、0、+sqrt(3/5) 的像。'

assumptions:
  - '本卡只固定记号与它们的换算关系，不判定任何求积公式的精确性；精确性住在 OM-F-NA-0001（三点公式对 p≤5 精确）的机器读数里'
  - 'lo<hi 是本卡全部记号的前提：lo=hi 时 half=0，三枚节点重合于 mid，记号仍可读但不再区分节点，本卡不把那种退化读作一条新的定义'
  - 'xi 指「节点」这一位置量，不指随机变量、不指方向余弦；本库把同名不同义记在术语一致性账上（TERM_INCONSISTENCY），本卡的口径只对自己声明的主人有效'
  - '裸字母 w（权重）与 t（积分变量）按第 4 批裁定「结构名铸、裸字母不铸」留在名单外：不进本卡的 symbols，也不因此被算成「已有定义」'

symbols:
  - name: 'lo'
    meaning_zh: '积分区间左端点（实数，满足 lo<hi）；三点 Gauss–Legendre 记录里它是采样点字段的一枚自由符号，规范区间取 -1'
    type: real
    constraints: 'lo<hi；机器读数钉 -1、1/2、0、-3 四档'
  - name: 'hi'
    meaning_zh: '积分区间右端点（实数，满足 lo<hi）；与 lo 一起把规范区间 [-1,1] 上的节点与权重搬到任意区间，搬家用 half=(hi-lo)/2'
    type: real
    constraints: 'hi>lo；机器读数钉 1、3、2、-1/4 四档（与 lo 成对）'
  - name: 'xi'
    meaning_zh: '求积节点（Gauss 节点）：xi_k = (lo+hi)/2 + (hi-lo)/2 * g_k，其中 g_k 是规范区间上的节点；三点公式的 g 为 ±sqrt(3/5) 与 0，它们是 P_3(x)=x^3-(3/5)x 的全部根'
    type: other

