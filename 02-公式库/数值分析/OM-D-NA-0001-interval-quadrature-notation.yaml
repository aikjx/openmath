caveat: '第 18 批记号卡：把 OM-F-NA-0001 用到的 3 枚结构名（lo、hi、xi）升成定义条目，符号账因此不动（净涨 0，按第 4 批裁定「结构名铸、裸字母不铸」）。铸卡前逐名量过主人：三枚在现面 0 主人、0 在未定义名单上（载体 scratch/T18B_NA_symbolclash.txt，打在 2026-10-19T02:48:25Z 那张图上），故本卡不会把别人的账抹成「已定义」；同一把尺在 k/n/theta 上抓到主人＝反对照通过。本卡不新增任何数学主张，只固定记号与口径。'

