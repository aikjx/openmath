statement_latex: 'K_n=(V,E),\ |V|=n,\ E=\binom{V}{2};\qquad R_r(k)=\min\{N:\ \text{对每个}\ c:E(K_N)\to[r]\ \text{存在单色}\ K_k\}'

assumptions:
  - 'r,k 均不小于 2（否则 Ramsey 数无意义或平凡）'
  - '着色指对**边**着色，颜色集取 [r]={1,...,r}'
  - '单色指存在一版同色的 K_k 顶点子集；本卡取通常的顶点完全子图口径'
symbols:
  - name: 'K_n'
    meaning_zh: 'n 个顶点的完全图：任意两点间恰有一条边'
    type: other
  - name: 'R_r(k)'
    meaning_zh: 'Ramsey 数：保证任意 r-边着色都含单色 K_k 的最小顶点数'
    type: other

