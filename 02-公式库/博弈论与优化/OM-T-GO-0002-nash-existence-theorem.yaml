schema_version: "0.1"

id: OM-T-GO-0002
kind: theorem
title_zh: 'Nash 均衡存在性定理'
title_en: 'Nash equilibrium existence theorem'
domain: GO
msc:
  - '91A10'
  - '55M20'
tags:
  - '均衡存在性'
  - '集值不动点'
  - '混合策略'

status: PROPOSED
evidence_level: L1
revision: 1
created: 2026-10-11
updated: 2026-10-11

statement_latex: '\text{有限博弈}\ \Longrightarrow\ \exists\ \sigma^{*}\in\prod_i\Delta_{S_i}:\ \forall i,\ \sigma^{*}_{i}\in\arg\max_{x_i\in\Delta_{S_i}}u_i(x_i,\sigma^{*}_{-i})'
hypotheses:
  - '参与人与策略集均有限'
  - '允许混合策略（策略集上的概率分布）'
proposed_by: 'John Forbes Nash Jr.'
proposed_year: 1950

assumptions:
  - '效用为期望效用（对混合策略线性），故最佳应对集值非空、凸、闭'
symbols:
  - name: '\sigma^{*}'
    meaning_zh: '一个混合策略组（结论断言其存在）；刻意不写裸 \sigma——\sigma 在本库由 OM-D-PR-0001 用作标准差'
    type: other
  - name: '\Delta_{S_i}'
    meaning_zh: '第 i 人的混合策略单纯形（记号由 OM-D-GO-0001 定义）'
    type: other
  - name: 'u_i'
    meaning_zh: '第 i 人的效用函数；\mathrm{BR}_i 指其最佳应对集值'
    type: other
  - name: '\arg\max'
    meaning_zh: '取到上确界的策略集合，即最佳应对集'
    type: other

