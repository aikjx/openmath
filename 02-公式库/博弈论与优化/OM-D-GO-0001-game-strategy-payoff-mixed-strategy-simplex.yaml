statement_latex: '\Gamma=(N,\ (S_i)_i,\ (u_i)_i),\qquad \Delta_{S_i}=\{p\in\mathbb{R}^{S_i}:\ p\ge 0,\ \textstyle\sum_{s}p(s)=1\},\qquad \mathrm{BR}_i(\sigma_{-i})=\arg\max_{x_i\in\Delta_{S_i}}u_i(x_i,\sigma_{-i})'
hypotheses:
  - 'N 为有限参与人集，每个 S_i 为有限策略集'
  - '效用按期望效用口径（对混合策略多重线性）'

assumptions:
  - '混合策略读作 S_i 上的概率分布，故 \Delta_{S_i} 是有限维单纯形'
symbols:
  - name: '\Gamma'
    meaning_zh: '一个博弈 \Gamma=(N,(S_i)_i,(u_i)_i)；刻意不写 G——G 已由 OM-D-GR-0001 用作群'
    type: other
  - name: 'N'
    meaning_zh: '参与人集（本卡在有限博弈口径下使用）'
    type: other
  - name: 'S_i'
    meaning_zh: '第 i 人的纯策略集'
    type: other
  - name: 'u_i'
    meaning_zh: '第 i 人的效用函数'
    type: other
  - name: '\Delta_{S_i}'
    meaning_zh: '第 i 人的混合策略单纯形'
    type: other
  - name: '\Delta_m'
    meaning_zh: 'm 元概率单纯形（极小极大卡里行玩家的策略集）'
    type: other
  - name: '\Delta_n'
    meaning_zh: 'n 元概率单纯形（极小极大卡里列玩家的策略集）'
    type: other
  - name: '\mathcal{M}'
    meaning_zh: '零和博弈的支付矩阵：u_1(x,y)=x^{\top}\mathcal{M}y'
    type: other
  - name: '\sigma^{*}'
    meaning_zh: '混合策略组 (\sigma^{*}_1,\dots,\sigma^{*}_n)'
    type: other
  - name: '\mathrm{BR}_i'
    meaning_zh: '第 i 人的最佳应对集值 \mathrm{BR}_i(\sigma_{-i})'
    type: other
  - name: '\arg\max'
    meaning_zh: '取到上确界的点之集合'
    type: other

