statement_latex: '|G|=p^{a}m,\ p\nmid m\ \Longrightarrow\ \exists P\le G,\ |P|=p^{a},\quad n_p\equiv 1\ (p),\ n_p\mid m'
hypotheses:
  - 'G 为有限群'
  - 'p 为素数'
  - 'n_p 为 p-Sylow 子群的个数'
proposed_by: 'Peter Sylow'
proposed_year: 1872

assumptions:
  - '拉格朗日定理可用（子群阶整除群阶）'
