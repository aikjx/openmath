  - name: 'p'
    meaning_zh: '素数'
    type: other
  - name: 'a'
    meaning_zh: 'p 在 |G| 中的重数'
    type: other
  - name: 'm'
    meaning_zh: '与 p 互素的余因子'
    type: other
  - name: 'P'
    meaning_zh: 'p-Sylow 子群'
    type: other
  - name: 'n_p'
    meaning_zh: 'p-Sylow 子群个数'
    type: other

