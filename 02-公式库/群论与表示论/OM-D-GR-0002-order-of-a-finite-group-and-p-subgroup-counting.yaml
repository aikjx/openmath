schema_version: "0.1"

id: OM-D-GR-0002
kind: definition
title_zh: '有限群的阶与 p-子群计数'
title_en: 'Order of a finite group and counting of p-subgroups'
domain: GR
msc:
  - '20A05'
  - '20D20'
tags:
  - '群的阶'
  - 'p-部分'
