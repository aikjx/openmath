updated: 2026-10-11

statement_latex: '|G|=p^{a}m,\ p\nmid m,\qquad n_p=\lvert\{P\le G:\lvert P\rvert=p^{a}\}\rvert'

assumptions:
  - 'G 为有限群，|G| 为其元素个数'
  - 'a 为 p 在 |G| 中的重数，m 为与 p 互素的余因子'
symbols:
  - name: '|G|'
    meaning_zh: '群的阶，即元素个数'
    type: other
  - name: 'p'
    meaning_zh: '素数'
    type: other
  - name: 'a'
    meaning_zh: 'p 在 |G| 中的重数'
    type: other
  - name: 'm'
    meaning_zh: '|G| 中与 p 互素的余因子'
    type: other
  - name: 'n_p'
    meaning_zh: 'p-Sylow 子群的个数'
    type: other
  - name: 'P'
    meaning_zh: '一个 p-Sylow 子群'
    type: other

