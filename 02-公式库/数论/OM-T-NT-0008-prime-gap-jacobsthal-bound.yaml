latex: >-
  g_n = p_{n+1}-p_n  <=  j(p_n#),
  j(M) = min { L : 任意 L 个连续整数中至少一个与 M 互素 }

assumptions:
  - "p_n 为第 n 个素数；p_n#=p_1...p_n"
  - "j(M) 为 Jacobsthal 函数：保证任意 j(M) 个连续整数中至少一个与 M 互素的最小长度"
statement_latex: >-
  素数间隙 g_n 不超过模 p_n# 的 Jacobsthal 函数：g_n <= j(p_n#)

hypotheses:
  - "p_n 为第 n 个素数；p_n#=p_1...p_n"
  - "j(M) 为 Jacobsthal 函数：保证任意 j(M) 个连续整数中至少一个与 M 互素的最小长度"

conclusion_latex: >-
  g_n = p_{n+1}-p_n <= j(p_n#)

proof: >-
  p_n 与 p_{n+1} 之间严格相邻，p_n+1,...,p_{n+1}-1 都不是素数，且每个都与 p_n# 不互素
  （这些整数的最小素因子 <= p_n：否则该整数 >= (p_n+1)^2 > p_{n+1}，与 < p_{n+1} < 2p_n 矛盾）。
  故这些连续非互素整数长度 g_n-1 不超过 j(p_n#)-1，即 g_n <= j(p_n#)。

