caveat: >-
  1) 本上界由 wheel 几何直接推出，但 Jacobsthal 函数自身结构复杂，本上界并不解决素数间隙问题；
  2) 寻找更窄的、可计算的 g_n 上界或新间隔定理是真正数论突破方向（OM-P-NT-0002，方向 C）；
  3) L2 仅对 n=1..7 数值核对（p_n# 可枚举），非形式化证明，也未覆盖大 n。

