caveat: >-
  1) 枚举到 2000（乃至任意有限 N）对 Legendre 猜想毫无证明价值：
     猜想是关于一切 n 的全称命题，而窗口密度随 n 增长（平均约 (2n+1)/(2 log n) 个素数），
     反例若存在更可能出现在大 n 处，有限扫描在原理上无法触及；
  2) 本条目的 L2 通过**不得**被读作"猜想很可能成立"；
  3) 已知无条件结果与猜想之间隔着一个完整的指数差（0.525 vs 0.5），
     且该差不是"再优化一点常数"就能消除的——它对应解析数论中零点密度估计的硬边界。

