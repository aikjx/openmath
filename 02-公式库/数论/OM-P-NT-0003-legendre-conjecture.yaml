id: OM-P-NT-0003
kind: problem
title_zh: Landau 第三问题 · Legendre 猜想（相邻平方数之间必有素数）
title_en: Landau's third problem - Legendre's conjecture (a prime between consecutive squares)
domain: NT
msc:
  - "11N05"   # 素数分布
  - "11A41"   # 素数
tags:
  - Landau 问题
  - Legendre 猜想
  - 短区间
  - 素数间隙
  - 开放问题

status: PROPOSED
evidence_level: L1
revision: 1
created: 2026-09-18
updated: 2026-09-18

assumptions:
  - "素数、完全平方数按通常定义；n 为正整数"
  - "(n+1)^2 对 n>=1 恒为合数，故窗口中 '<' 与 '<=' 两种写法等价"
  - "c(n) 的定义见 OM-F-NT-0003，与 pi((n+1)^2)-pi(n^2) 一致"

statement_latex: >-
  对一切正整数 n，存在素数 p 满足 n^2 < p < (n+1)^2；
  等价地 c(n) := pi((n+1)^2) - pi(n^2) >= 1（因 (n+1)^2 对 n>=1 恒为合数，<= 与 < 等价）

proposed_by: "Adrien-Marie Legendre"
proposed_year: 1808

current_status: OPEN

partial_results:
  - year: 1930
    author: "Hoheisel"
    result: "首次证明存在 theta < 1 使得充分大的 x 在 [x, x+x^theta] 内必有素数"
  - year: 2001
    author: "Baker, Harman, Pintz"
    result: "theta = 0.525 可行：[x, x+x^0.525] 内必有素数（x 充分大）"

resolution: null
refutation: null
prize: ""

equivalent_forms:
  - "c(n) = pi((n+1)^2) - pi(n^2) >= 1 对一切 n >= 1（见 OM-F-NT-0003）"
  - "素数间隙形式：记 p_k 为第 k 个素数，则 g_k = p_{k+1} - p_k < 2*sqrt(p_k) + 1"

implications:
  - statement: "Cramér 猜想（g_k = O((log p_k)^2)）蕴含 Legendre 猜想（对充分大的 n）"
    direction: "sufficient"
    note: "log^2 增长远慢于 sqrt，故充分大后间隙必然小于 2*sqrt(p)+1"
  - statement: "Riemann 假设不蕴含 Legendre 猜想"
    direction: "insufficient"
    note: "RH 只给间隙 O(sqrt(p) log p)，比窗口长度 2*sqrt(p)+1 多一个 log 因子；量级上不足以闭合"
  - statement: "Baker-Harman-Pintz 的无条件结果不覆盖 Legendre 窗口"
    direction: "insufficient"
    note: "窗口长度 2*sqrt(x)+1 对应指数 1/2 < 0.525；且 x^0.525 超过 2*sqrt(x)+1 的临界点约 x* ≈ 1.1e12"

