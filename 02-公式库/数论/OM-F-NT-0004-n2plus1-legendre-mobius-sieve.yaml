    L3:
      passed: true
      engine: landau-symbolic
      method: >-
        sympy 1.13.3：符号变量展开 Euler 积；sympy.ntheory.modular.crt 构造性核对 CRT；
        sympy.logic.inference.satisfiable 对完备化恒等式做命题逻辑证明；
        高精度（mpmath 15 位有效）Mertens 渐近与交叉一致性
      script: 05-验证中心/01-引擎/landau_symbolic.py
      last_run: 2026-09-18
      checks:
        - "S4.1 prod_p(1-x_p) 的符号展开 == sum_S (-1)^{|S|} prod_{p in S} x_p，7 个素因子 128 项，残差 = 0"
        - "S4.1b 代入 x_p = omega(p)/p：prod_{p<=17}(1-omega(p)/p) = 99/442（精确有理数）"
        - "S4.2 CRT 构造性核对：x^2 ≡ -1 (mod d) 的解数 == prod omega(p)，d 取 <=3 个素数的全部组合"
        - "S4.3 完备化恒等式的命题逻辑证明：satisfiable(前提 ∧ ¬结论) = False（命题层无反模型）"
        - "S4.4 余项上界展开：sum_{d|P(Y)} omega(d) == prod_{p<=Y}(1+omega(p))，Y=37 时两侧均为 486"
        - "S4.6 Mertens 交叉一致性：log Y·prod(1-omega/p) 与 e^{-gamma}·C_BH(Y) 偏差单调下降，Y=10^5 处 3.04e-4"
      note: >-
        **L3 不是证明。** S4.1/S4.4 是符号恒等式的展开比对；S4.3 在给定四条前提之下
        是命题层的完整证明（SAT 判空），但前提本身依赖初等数论事实而不是本库导出的。
        S4.5/S4.6 依赖 Mertens 第三定理与算术级数中的素数定理，此处只作登记与一致度量。
        本库 L4 = 0，任何条目都不得标注"已证明"。
