        - "C_d(N) = omega(d)*floor(N/d) + r_d, 0 <= r_d <= omega(d)：全部 d 成立（CRT 余数界）"
        - "完备化 A(500)=A_501(500)+E=62+8=70，与确定性 Miller-Rabin 判定一致（残差 0）"
