latex: >-
  Meissel: pi(x) = phi(x,a) + a - 1 - sum_{i=a+1}^{b} (pi(floor(x/p_i)) - i + 1),
  a = pi(x^{1/3}), b = pi(x^{1/2});
  Lehmer: pi(x) = phi(x,a) + (b+a-2)(b-a+1)/2
   - sum_{i=a+1}^{b} pi(floor(x/p_i))
   - sum_{i=a+1}^{c} sum_{j=i}^{pi(sqrt(x/p_i))} (pi(floor(x/(p_i p_j))) - j + 1),
  c = pi(x^{1/4})

assumptions:
  - "x 为非负整数"
  - "p_i 为第 i 个素数，索引从 1 开始"
  - "phi(x,a) 定义见 OM-F-NT-0001"
  - "整数立方根/四次根必须精确求得；浮点近似会导致 a、b、c 取错"
  - "小 x 需要独立的基准实现（筛法前缀表）作为终止条件"

symbols:
  - name: "a"
    meaning_zh: "pi(x^{1/3})，phi 的筛除素数个数"
    type: natural
  - name: "b"
    meaning_zh: "pi(x^{1/2})，P_2 求和上界"
    type: natural
  - name: "c"
    meaning_zh: "pi(x^{1/4})，P_3 求和上界（仅 Lehmer）"
    type: natural

domain_of_validity: "一切 x >= 0；严格等式，无条件、无猜想依赖"

specializations: []
generalizations: []
related:
  - OM-F-NT-0001
  - OM-P-NT-0002

caveat: >-
  1) 表限内的 pi(x) 直接查表会让递归路径"空过"，检查必须另建小表引擎强制递归；
  2) 节点计数前必须清空记忆化，否则跨调用复用会虚报 0；
  3) 整数根必须精确，浮点 x**(1/3) 在大 x 上会取错 a；
  4) 复杂度一栏是文献值，本库未做跨量级渐近拟合；
  5) L2 通过只能证伪，不构成正确性证明（红线一）。

