latex: >-
  Delta pi(N) = pi(N) - pi(N-1) = I_P(N);
  p_n = min{x>=2: pi(x) >= n},  pi(p_n)=n,  pi(p_n-1)=n-1;
  LargestPrime_{<=N} = p_{pi(N)};  NextPrime(N) = p_{pi(N)+1}

assumptions:
  - "N>=2；pi 为素数计数函数（严格等式，见 OM-D-NT-0001 / OM-F-NT-0001）"
  - "第 n 个素数 p_n 按通常顺序定义"
statement_latex: >-
  I_P(N) <=> Delta pi(N) = pi(N)-pi(N-1);
  p_n = min{x>=2: pi(x)>=n} 且 pi(p_n)=n;
  LargestPrime_{<=N}=p_{pi(N)};  NextPrime(N)=p_{pi(N)+1}

hypotheses:
  - "N>=2；pi 为素数计数函数（严格等式，见 OM-D-NT-0001 / OM-F-NT-0001）"
  - "第 n 个素数 p_n 按通常顺序定义"

conclusion_latex: >-
  素数位置 = pi 的离散一阶导数；pi 是其离散积分；p_n 是 pi 的离散广义逆

proof: >-
  由 OM-D-NT-0001，pi(N)-pi(N-1) 恰为区间 (N-1,N] 中素数个数，即 I_P(N)。
  由 pi 严格递增（每步 +0 或 +1），p_n = min{x: pi(x)>=n} 给出第 n 个素数且 pi(p_n)=n。
  对 LargestPrime：pi(N) 个素数中最大的是第 pi(N) 个，即 p_{pi(N)}。
  NextPrime(N) 即第 pi(N)+1 个素数。

symbols:
  - name: "Delta pi(N)"
    meaning_zh: "pi 的有限差分（离散导数）"
    type: integer
  - name: "p_n"
    meaning_zh: "第 n 个素数"
    type: integer

domain_of_validity: "一切正整数 N, n；无条件、无猜想依赖"

