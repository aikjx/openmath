caveat: >-
  1) 「素数求导」在数学上应理解为离散导数或分布导数（每个素数位置对应一个单位 Dirac 质量），
     而非普通连续导数（红线：不得误称连续导数）；
  2) 精确公式不等于快速公式：p_n 的离散逆仍需逐点计算 pi，见 OM-F-NT-0002 与 OM-P-NT-0002；
  3) L2 仅数值交叉，非形式化证明。

