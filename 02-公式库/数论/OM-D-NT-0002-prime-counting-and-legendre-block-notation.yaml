schema_version: "0.1"

id: OM-D-NT-0002
kind: definition
title_zh: '素数计数与 Legendre 分块的记号'
title_en: 'Prime counting and Legendre block notation'
domain: NT
msc:
  - '11A05'
  - '11N05'
  - '11-04'
tags:
  - '素数计数'
  - 'Legendre 分块'
  - '记号定义'
  - '离散差分'

status: PROPOSED
evidence_level: L1
revision: 2
created: 2026-10-11
updated: 2026-10-18

statement_latex: '\pi(x)=\#\{p\le x:\ p\ \text{是素数}\},\qquad \phi(x,a)=\#\{1\le m\le x:\ \text{没有素因子}\le p_a\},\qquad \Delta\pi(N)=\pi(N)-\pi(N-1),\qquad g_n=p_{n+1}-p_n'

assumptions:
  - 'x 为实数，N 为正整数；计数取左闭右开或按各卡正文注明的空隙约定'
  - 'a 为非负整数，a=0 时 phi(x,0)=floor(x)（不做任何筛除）'
  - 'p_1=2，素数按升序编号；本卡只固定编号，不引入任何第 n 素数的界'
symbols:
  - name: 'pi(x)'
    meaning_zh: '素数计数函数：不超过 x 的素数个数'
    type: other
  - name: 'phi(x,a)'
    meaning_zh: 'Legendre 分块函数：[1,x] 中不被 p_1..p_a 任一整除的整数个数（含 1）'
    type: other
  - name: 'p_a'
    meaning_zh: '第 a 个素数（p_1=2，升序编号）'
    type: other
  - name: 'p_n'
    meaning_zh: '第 n 个素数'
    type: other
  - name: 'Delta pi(N)'
    meaning_zh: 'pi 的有限差分（离散导数）：N 为素数时取 1，否则取 0'
    type: other
  - name: 'L_n'
    meaning_zh: '第 n 个素数的下界（含 +1 取整），由 OM-F-NT-0002 的母公式给出'
    type: other
  - name: 'U_n'
    meaning_zh: '第 n 个素数的上界（向上取整），由 OM-F-NT-0002 的母公式给出'
    type: other
  - name: 'c(n)'
    meaning_zh: '方块窗口计数：开区间 (n^2,(n+1)^2] 内的素数个数'
    type: other
  - name: 'g_n'
    meaning_zh: '第 n 个素数间隙：p_{n+1}-p_n'
    type: other
  - name: 'p_k'
    meaning_zh: '第 k 个素数；与 p_n 是同一对象，索引字母换作 k（OM-P-NT-0010 按这套拼写）'
    type: other
  - name: 'g_k'
    meaning_zh: '第 k 个素数间隙 p_{k+1}-p_k；与 g_n 是同一对象，索引字母换作 k'
    type: other
  - name: 'A_k'
    meaning_zh: '相邻素数平方根差 A_k=sqrt(p_{k+1})-sqrt(p_k)，由 OM-P-NT-0010 引入并在其 L2 检验里逐间隙求值'
    type: other

