caveat: '第 4 批记号卡：把 OM-F-NT-0001/0002/0003、OM-T-NT-0001/0002/0008 与 OM-A-NT-0001 共用的 9 枚记号升成定义条目。本卡不新增任何数学主张，只固定记号与口径。第 11 批（2026-10-18）另收 3 枚：p_k、g_k 是 p_n、g_n 的索引字母别名，A_k=sqrt(p_{k+1})-sqrt(p_k) 由 OM-P-NT-0010 引入——三者按同一实践铸卡（结构名铸、裸字母不铸），索引字母 k 本身仍留在名单外。'

