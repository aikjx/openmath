schema_version: "0.1"

id: OM-P-NT-0004
kind: problem
title_zh: Landau 第四问题 · 是否存在无穷多个素数形如 n²+1
title_en: Landau's fourth problem - are there infinitely many primes of the form n^2+1
domain: NT
msc:
  - "11N32"   # 由多项式表示的素数
  - "11N35"   # 筛法
  - "11A41"   # 素数
tags:
  - Landau 问题
  - n^2+1
  - 筛法
  - Bateman-Horn
  - 开放问题

status: PROPOSED
evidence_level: L1
revision: 1
created: 2026-09-18
updated: 2026-09-18

assumptions:
  - "n 为正整数，素数按通常定义"
  - "A(N) 的定义见 OM-F-NT-0004"
  - "P_2 指至多两个素因子的乘积（计重数）"

statement_latex: >-
  是否存在无穷多个正整数 n 使得 n^2 + 1 为素数？
  记 A(N) = #{n <= N : n^2+1 为素数}，即问 A(N) 是否无界。

proposed_by: "Edmund Landau"
proposed_year: 1912

current_status: OPEN

partial_results:
  - year: 1978
    author: "Iwaniec"
    result: >-
      存在无穷多个 n 使 n^2+1 为 P_2（至多两个素因子的乘积）。
      这是目前最强的弱化结论，仍未跨越到"素数"本身。

resolution: null
refutation: null
prize: ""

equivalent_forms:
  - "A(N) = A_Y(N) + E(N,Y)（Y >= N+1）中 A(N) 是否无界（见 OM-F-NT-0004）"
  - "素数 p 使 p-1 为完全平方数者是否有无穷多个（n^2+1=p <=> p-1=n^2）"

implications:
  - statement: "Bateman-Horn 猜想蕴含本问题成立，并给出 A(N) ~ (C_BH/2) * Li(N)"
    direction: "sufficient"
    note: "BH 是启发式猜想，不是定理；它对本问题只有'蕴含'关系，不构成证明"
  - statement: "本问题与孪生素数猜想同为筛法维度 1，已知结果高度平行（都停在几乎素数层）"
    direction: "structural"
    note: "见 OM-F-NT-0004 第四节：omega(p) 在 p≡1(4) 取 2、p≡3(4) 取 0，平均维数为 1"

fact_check:
  status: UNVERIFIED
  sources:
    - "Iwaniec, H. 'Almost-primes represented by quadratic polynomials', Invent. Math. 47 (1978)"
    - "Bateman, P. T.; Horn, R. A. (1962)"
  note: >-
    本库尚未逐条核对原始文献。1912 为 Landau 在国际数学家大会提出四个问题的标准年份，
    Iwaniec 的 P_2 结论为标准引用。待核对原文后升级为 VERIFIED。

