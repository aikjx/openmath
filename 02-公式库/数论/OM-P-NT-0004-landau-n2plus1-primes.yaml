caveat: >-
  1) A(N) 无界是一个全称/无限命题，任何有限 N 的计数都不构成证据；
  2) Bateman-Horn 的局部积是**条件收敛**的（p≡1(4) 与 p≡3(4) 两侧的对数项相互抵消），
     截断值会振荡，因此"实测比值与截断常数吻合"只说明启发式自洽，
     不说明常数已收敛，更不说明渐近式成立；
  3) Iwaniec 的 P_2 结论是本库**引用**的文献结果，本库不重新证明、
     也不为其提供机器证据；本引擎只给出 P_2 层的实测计数作对照。

