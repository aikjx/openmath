latex: >-
  min{ C>1 : C composite and gcd(C,m!)=1 } = [NextPrime(m)]^2

assumptions:
  - "m>=2 为整数；q=NextPrime(m)"
  - "gcd(C,m!)=1 意味着 C 的素因子全部 > m"
statement_latex: >-
  设 q=NextPrime(m)，则严格大于 1 且与 m! 互素的最小合数恰为 q^2

hypotheses:
  - "m >= 2 为整数；q=NextPrime(m)"
  - "gcd(C,m!)=1 意味着 C 的素因子全部 > m"

conclusion_latex: >-
  FirstEscapeComposite(m) = q^2

proof: >-
  因 gcd(C,m!)=1，C 的所有素因子均 > m；最小的大于 m 的素数是 q，故每个素因子 >= q。
  合数至少含两个素因子（计重数），所以 C >= q^2。另一方面 q^2 显然为合数且
  gcd(q^2,m!)=1。故最小值恰为 q^2。

