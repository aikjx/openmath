caveat: >-
  1) 该刻画是下一素数的等价定义性命题（初等），用于把"下一素数"与"互素结构"挂钩；
  2) 直接枚举 x 找互素整数实际仍要判素，不是更快算法；
  3) 同类阶乘/互素刻画为初等式推论，不构成优先权主张；
  4) L2 仅数值核对，非形式化证明。

