revision: 1
created: 2026-09-10
updated: 2026-09-10

latex: >-
  q = NextPrime(m) = min{ x>m : gcd(x, m!) = 1 }

assumptions:
  - "m>=2 为整数"
  - "m! 包含且仅包含所有素数 <=m 的全部幂次"
statement_latex: >-
  对任意整数 m>=2，严格大于 m 的最小素数 q 等于严格大于 m 的最小与 m! 互素的整数

hypotheses:
  - "m >= 2 为整数"
  - "m! 包含且仅包含所有素数 <= m 的全部幂次"

conclusion_latex: >-
  NextPrime(m) = min{ x>m : gcd(x, m!) = 1 }

proof: >-
  记右侧最小元素为 r。由于 q>m 为素数，q 不整除 m!，故 gcd(q,m!)=1，从而 r<=q。
  若 r 为合数，取其素因子 s<m（否则 s>=m 且 s|r 与 gcd(r,m!)=1 矛盾），则
  gcd(s,m!)=1，与 r 的最小性矛盾。故 r 必为素数，r=q。

symbols:
  - name: "NextPrime(m)"
    meaning_zh: "严格大于 m 的最小素数"
    type: integer
  - name: "m!"
    meaning_zh: "m 的阶乘"
    type: integer

domain_of_validity: "一切整数 m>=2；初等命题，无条件"

