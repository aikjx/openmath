schema_version: "0.1"

id: OM-F-NT-0003
kind: formula
title_zh: 区间素数计数的 Legendre 窗口恒等式（方块窗口）
title_en: Legendre window identity for interval prime counting (square window)
domain: NT
msc:
  - "11N05"   # 素数分布：素数计数函数
  - "11A41"   # 素数
tags:
  - 素数计数
  - Legendre phi
  - 短区间
  - 方块窗口
  - Legendre 猜想

status: VERIFIED(L3)
evidence_level: L3
revision: 2
created: 2026-09-18
updated: 2026-09-18

latex: >-
  c(n) := #{p prime : n^2 < p <= (n+1)^2} = pi((n+1)^2) - pi(n^2);
  c(n) = phi((n+1)^2, a) - phi(n^2, a) with a = pi(n+1), for n >= 2

assumptions:
  - "n 为正整数"
  - "pi(x) 为不超过 x 的素数个数"
  - "phi(x,a) 计数 [1,x] 中不被前 a 个素数整除的整数，含 1"
  - "第二式要求 n >= 2（n=1 时窗口含素数 2 = n+1，会被筛除）"

symbols:
  - name: "n"
    meaning_zh: "窗口下界平方根"
    type: natural
    constraints: "n >= 1"
  - name: "c(n)"
    meaning_zh: "开区间 (n^2, (n+1)^2] 内素数个数"
    type: natural
  - name: "pi(x)"
    meaning_zh: "不超过 x 的素数个数"
    type: natural
  - name: "phi(x,a)"
    meaning_zh: "[1,x] 中不被 p_1..p_a 任一整除的整数个数（含 1）"
    type: natural
  - name: "a"
    meaning_zh: "筛除所用素数的个数，本式中取 pi(n+1)"
    type: natural

domain_of_validity: >-
  第一式对一切正整数 n 成立（恒等式，无附加条件）；
  第二式对 n >= 2 成立。

specializations: []
generalizations: []
related:
  - OM-F-NT-0001
  - OM-P-NT-0003

caveat: >-
  1) 第一式是定义式重述，本身不提供任何素数分布信息；本条目的实质内容是第二式——
     它把"短区间计数"还原为两个 phi 值之差，从而可以用分块递归而非逐个判素来计算；
  2) 第二式的有效性依赖 a = pi(n+1) >= pi(sqrt((n+1)^2)) = pi(n+1)，
     即窗口上界内的合数必带 <= n+1 的素因子，故 phi 差值中不残留合数；
  3) n=1 是唯一的例外（窗口含素数 2 = n+1），已在 domain_of_validity 中排除；
  4) 本条目只提供 L2 数值证据：两路算法逐点相等不构成证明（红线一）。

