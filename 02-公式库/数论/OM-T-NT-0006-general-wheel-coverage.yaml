caveat: >-
  1) 本定理是 primorial wheel / wheel sieve 的成熟框架（M=6 仅最低阶特例），不构成首创；
  2) 周期密度严格为 phi(M)/M = prod_{j=1}^r (1-1/p_j)；本定理只给单点因子坐标，
     整块覆盖计数（交叠项）仍是开放问题（见 OM-P-NT-0002 方向 B）；
  3) L2 仅数值核对，非形式化证明。

