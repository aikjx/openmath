latex: >-
  gcd(N,M)=1, N=Ma+r, M=b+s? no; N=(Ma+r)(Mb+s),
  k = Mab + a s + b r + (rs-u)/M,
  r,s in R_M={1<=t<M: gcd(t,M)=1}, u=N mod M

assumptions:
  - "M 为任意正整数（可取 M=p_r# 轮积）"
  - "gcd(N,M)=1；若 N 合数则可写 N=xy 且 gcd(x,M)=gcd(y,M)=1"
statement_latex: >-
  设 gcd(N,M)=1，R_M 为模 M 约化剩余系，N=Mk+u。则 N 为合数当且仅当存在
  r,s in R_M 与 a,b>=0（且 Ma+r>1, Mb+s>1）使 N=(Ma+r)(Mb+s)，
  即 k = Mab + a s + b r + (rs-u)/M

hypotheses:
  - "M 为任意正整数（可取 M=p_r# 轮积）"
  - "gcd(N,M)=1；若 N 合数则可写 N=xy 且 gcd(x,M)=gcd(y,M)=1"

conclusion_latex: >-
  N composite <=> exists r,s in R_M, a,b>=0 : N=(Ma+r)(Mb+s)

proof: >-
  若 gcd(N,M)=1 且 N=xy（x,y>1），则 gcd(x,M)=gcd(y,M)=1，故
  x=Ma+r,\ y=Mb+s，其中 r,s in R_M。展开 (Ma+r)(Mb+s)=M^2 ab+Mas+Mbr+rs；
  令 u=rs mod M、t=(rs-u)/M，则 Mk+u = M(Mab+as+br+t)+u，得
  k=Mab+as+br+(rs-u)/M。反之若等式成立且两因子 >1，则 N 为合数。

symbols:
  - name: "R_M"
    meaning_zh: "模 M 约化剩余系 {1<=t<M: gcd(t,M)=1}"
    type: set
  - name: "M"
    meaning_zh: "wheel 模（常取 primorial M_r=p_r#）"
    type: integer

domain_of_validity: "任意 M>=1，gcd(N,M)=1；初等乘法结构，无条件"

specializations:
