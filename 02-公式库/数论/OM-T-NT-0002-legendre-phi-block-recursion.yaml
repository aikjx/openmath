caveat: >-
  1) 本条目只核对 Legendre 递归与其直接定义逐点一致，并推出 pi=phi+a-1；
     真正的 Meissel / Lehmer 加速（P2/P3）由 OM-F-NT-0001 / OM-A-NT-0001 与 prime-pi-block 引擎独立承担；
  2) 递归为"分块"手段，本身仍非亚线性；亚线性来自 Meissel–Lehmer / LMO（见 OM-P-NT-0002）；
  3) L2 仅数值交叉，非形式化证明。

