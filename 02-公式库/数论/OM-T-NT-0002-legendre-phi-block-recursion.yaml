latex: >-
  phi(x,a)=phi(x,a-1)-phi(floor(x/p_a),a-1), phi(x,0)=x;
  pi(x)=phi(x,a)+a-1,  a=pi(floor(sqrt(x)))

assumptions:
  - "x 为非负整数；p_a 为第 a 个素数；phi(x,0)=x"
  - "a=pi(floor(sqrt(x)))，此时所有素因子>p_a 的合数 >=(p_a+1)^2>x"
statement_latex: >-
  Legendre 分块函数 phi(x,a)=#{1<=m<=x: 所有素因子>p_a} 满足递归
  phi(x,a)=phi(x,a-1)-phi(floor(x/p_a),a-1)；
  取 a=pi(floor(sqrt(x))) 有 pi(x)=phi(x,a)+a-1

hypotheses:
  - "x 为非负整数；p_a 为第 a 个素数；phi(x,0)=x"
  - "a=pi(floor(sqrt(x))) 时，所有素因子>p_a 的合数 >=(p_a+1)^2>x，故 phi 仅计 1 与大于 p_a 的素数"

conclusion_latex: >-
  pi(x) = phi(x, pi(floor(sqrt(x)))) + pi(floor(sqrt(x))) - 1

proof: >-
  phi(x,a) 计 1..x 中不被前 a 个素数整除的整数。递归：从"不被前 a-1 个整除"的集合中，
  减去那些被 p_a 整除但不被前 a-1 个整除的（即 p_a 乘以一个不被前 a-1 个整除的数，
  共 phi(floor(x/p_a), a-1) 个）。当 a=pi(floor(sqrt(x))) 时，所有素因子>p_a 的合数
  最小为 (p_a+1)^2>x，故 phi 中除 1 外恰为大于 p_a 的素数，个数为 pi(x)-a，得 pi(x)=phi+a-1。

symbols:
