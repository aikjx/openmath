latex: >-
  delta_d(N) = floor(N/d) - floor((N-1)/d) = 1_{d|N};
  I_P(N) = 0 (N<2), else prod_{d=2}^{floor(sqrt(N))} (1 - delta_d(N));
  Theta(z) = ceil(z/(|z|+1)) = 1_{z>0} (z integer)

assumptions:
  - "N, d 为正整数"
  - "I_P(N) 的连乘上界为 floor(sqrt(N))，空乘积（N<4 时）规定为 1"
  - "Theta(z) 此处只用于整数 z；对一般实数需另行定义"

symbols:
  - name: "delta_d(N)"
    meaning_zh: "整除脉冲：d 整除 N 时为 1，否则为 0"
    type: integer
    constraints: "delta_d(N) in {0,1}"
  - name: "I_P(N)"
    meaning_zh: "素数指示函数：N 为素数时为 1，否则为 0"
    type: integer
    constraints: "I_P(N) in {0,1}"
  - name: "Theta(z)"
    meaning_zh: "整数正阶跃：z>0 时为 1，否则为 0"
    type: integer
    constraints: "Theta(z) in {0,1}"

domain_of_validity: "一切正整数 N, d；恒等式，无条件、无猜想依赖"

specializations: []
generalizations: []
related:
  - OM-T-NT-0001
  - OM-F-NT-0001

caveat: >-
  1) delta_d 把"是否整除"变成确定代数量，是后续一切精确判素结构的起点；
  2) I_P(N) 直接试除至 sqrt(N)，单点判素最坏 O(sqrt(N)) 次整除检查，不是快速算法；
  3) L2 通过（精确整数核对）只说明公式内部自洽，不构成证明（红线一）。

