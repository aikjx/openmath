caveat: >-
  1) 递归节点数与试除取模数是不同的基本操作，单次常数不同，压缩比只说明操作数量级；
  2) 测量前必须清空 phi 记忆表，否则重复查询会虚报 0 节点（本库实测踩坑）；
  3) 轮积掩码实现的内存随 p_k# 指数增长，k 较大时不可行；
  4) 本条目只提供 L2 数值证据，数值一致不构成证明。

