  - 轮积筛
  - 分块递归
  - 精确算法

status: VERIFIED(L2)
evidence_level: L2
revision: 1
created: 2026-09-10
updated: 2026-09-10

latex: >-
  phi(x,a) = phi(x,a-1) - phi(floor(x/p_a), a-1), phi(x,0) = x;
  pi(x) = phi(x,a) + a - 1 with a = pi(floor(sqrt(x)));
  phi(x,k) = floor(x/p_k#) * varphi(p_k#) + #{1 <= r <= x mod p_k# : gcd(r, p_k#) = 1}

assumptions:
  - "x 为非负整数，a 为非负整数"
  - "p_i 表示第 i 个素数（p_1 = 2）"
  - "phi 计数区间为 [1, x]，因此 phi(x, a) 包含 1"
  - "p_k# 表示前 k 个素数的乘积（primorial），p_0# = 1，varphi(p_0#) = 1"

symbols:
  - name: "x"
    meaning_zh: "计数上界"
    type: natural
    constraints: "x >= 0"
  - name: "a"
    meaning_zh: "参与筛除的素数个数"
    type: natural
    constraints: "a >= 0"
  - name: "p_a"
    meaning_zh: "第 a 个素数"
    type: natural
    constraints: "p_1 = 2"
  - name: "phi(x, a)"
    meaning_zh: "[1,x] 中不被 p_1..p_a 任一整除的整数个数"
    type: natural
    constraints: "phi(x,0) = x"
  - name: "pi(x)"
    meaning_zh: "不超过 x 的素数个数"
    type: natural
  - name: "p_k#"
    meaning_zh: "前 k 个素数的乘积（primorial）"
    type: natural
    constraints: "p_0# = 1"

domain_of_validity: "一切非负整数 x 与非负整数 a；恒等式，无附加条件"

specializations: []
generalizations: []
related:
