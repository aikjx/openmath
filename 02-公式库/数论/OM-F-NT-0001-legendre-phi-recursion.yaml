id: OM-F-NT-0001
kind: formula
title_zh: Legendre φ 分块递归与轮积恒等式
title_en: Legendre phi block recursion and the primorial wheel identity
domain: NT
msc:
  - "11N05"   # 素数分布：素数计数函数
  - "11A41"   # 素数
tags:
  - 素数计数
