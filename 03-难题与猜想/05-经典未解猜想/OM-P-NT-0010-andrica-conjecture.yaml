schema_version: "0.1"

id: OM-P-NT-0010
kind: problem
title_zh: Andrica 猜想（相邻素数平方根之差恒小于 1）· 平方根尺度的素数间隙
title_en: Andrica's conjecture - the square-root gap between consecutive primes is less than 1
domain: NT
msc:
  - "11N05"
  - "11A41"
tags:
  - 素数间隙
  - Andrica 猜想
  - Legendre 猜想
  - 整数判据
  - 开放问题

status: PROPOSED
evidence_level: L1
revision: 1
created: 2026-10-18
updated: 2026-10-18

statement_latex: >-
  \forall k\ge 1,\quad \sqrt{p_{k+1}}-\sqrt{p_k}<1,\qquad
  g_k:=p_{k+1}-p_k,\qquad \text{整数等价判据}\ (g_k-1)^2<4p_k

proposed_by: "Dorin Andrica"
proposed_year: 1986

current_status: OPEN
resolution: null
refutation: null
prize: ""

# 本库的 YAML 子集解析器（openmath/yamlish.py）**不折列表项的续行**，也不认列表项里的 `>-`
# （实测：`- >-` 解析成字面串 '>-' 并吞掉其后的项；无引号标量里的 ": " 会把该项劈成 dict）。
# 所以下面每一条列表项都是**单行**、含冒号的文本一律加双引号——这不是排版洁癖，
# 是「机读面与人类面同文」的唯一写法。全库在这一通道上的实测见
# scratch/T11_PARSELOSS_face.txt 与 caveat 第 6) 条。
assumptions:
  - "p_k 是第 k 个素数（p_1=2、p_2=3），g_k 记 p_{k+1} − p_k；两个记号由 OM-D-NT-0002 固定"
  - "sqrt 取正实平方根；本卡每一条数值判决都改写成整数不等式判定，不依赖浮点平方根的位数"
  - "猜想是关于一切 k >= 1 的全称命题；本卡的数值面只覆盖 p_k < 30000000 的 1857858 枚间隙与 n=1..5476 的 Legendre 窗口（载体现印：scratch/T11_VERIFY_NT0010.txt）"
  - "整数判据 (g_k − 1)² < 4 p_k 对 g_k = 1（只有 k=1，即 2→3）取 0 < 8，与实数形式同判，故不必为「平方要求两侧非负」另开分支；脚本把这一格连同全部间隙一起判，未做无名排除"

symbols:
  - name: "k"
    meaning_zh: "素数序号，从 1 起"
    type: integer
    constraints: "k >= 1"
  - name: "p_k"
    meaning_zh: "第 k 个素数"
    type: integer
    constraints: "p_1=2；记号定义见 OM-D-NT-0002"
  - name: "g_k"
    meaning_zh: "相邻素数间隙 p_{k+1} − p_k"
    type: integer
    constraints: "k>=2 时为偶数且 >=2；g_1=1；记号定义见 OM-D-NT-0002"
  - name: "A_k"
    meaning_zh: "本猜想的对象：sqrt(p_{k+1}) − sqrt(p_k)"
    type: real
    constraints: "0 < A_k；猜想断言 A_k < 1 对一切 k 成立"

domain_of_validity: "命题本身：一切 k ≥ 1，状态 OPEN。本卡的数值读数范围：p_k < 30000000 的 1857858 枚间隙，以及 n=1..5476 的 Legendre 窗口；两组读数同出一张凭据 scratch/T11_VERIFY_NT0010.txt。"

specializations: []
generalizations: []
related:
  - OM-P-NT-0009
  - OM-F-NT-0003

equivalent_forms:
  - "三型逐项互推：A_k = sqrt(p_{k+1}) − sqrt(p_k) < 1 等价于 g_k < 2*sqrt(p_k) + 1，等价于 (g_k − 1)² < 4 p_k。前两型之间是「同加 sqrt(p_k) 再平方」，后两型之间是「移项后两边同除 2 再平方」。本库不靠这段推导自证：第 1 与第 3 型由两条互不相干的整数通道（平方路线＋2^60 定点平方根路线）在全部 1857858 枚间隙上逐格同判，未决 0 枚、异判 0 枚（载体 scratch/T11_VERIFY_NT0010.txt 的判定1a–1c）。记号 p_k、g_k 见 OM-D-NT-0002"

implications:
  - "充分上游（本卡 ⇒ Legendre）：设 p_k 是不超过 n² 的最大素数，则 p_{k+1} < (sqrt(p_k)+1)² ≤ (n+1)² 且 p_{k+1} > n²，故窗口 (n², (n+1)²) 非空——即本猜想蕴含 OM-P-NT-0009。该推导已在 n=1..5476 逐窗口机械执行：界步 (n²−p_k+2n)² − 4p_k 的最小值是 13 @ n=2（p_k=3），非负即闭合；同一段扫描里空窗 0 个、min c(n) = 2 @ n=1（载体同上，判定4a–4c）"
  - "反方向本库未证，且已定位它为何不是显然：Legendre 的每个窗口只调用 k = pi(n²) 那一枚间隙，5476 个窗口对 1857858 枚间隙的覆盖率现数为 0.2947%，其余 99.7053% 的间隙即便违反 A_k < 1 也不在任何 Legendre 窗口的管辖之内（载体同上，判定4d）。因此 OM-P-NT-0009 过去把「间隙形式」列在自己的 equivalent_forms 名下是错标：那一式与本卡诸型等价，对 Legendre 却只是充分条件；第 11 批已把该行从那张表移出，改由本卡承担"

