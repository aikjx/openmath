caveat: >-
  1) 红线一：扫描范围内无反例≠猜想成立；本卡的 evidence_level 停在 L1、
     status 停在 PROPOSED／current_status 停在 OPEN，正是为此。
  2) 本卡与 OM-P-NT-0009 是**蕴含**关系而非等价关系：Andrica ⇒ Legendre（推导已机械核对），
     Legendre ⇒ Andrica 本库未证。覆盖率读数 0.2947% 说的是
     「把间隙逐枚读成窗口条件」这条通道根本不存在，它否证了 P-NT-0009 旧卡的错标，
     但**不是**「两命题不等价」的证明——真要证不等价得造一个 Legendre 成立而某枚间隙违反
     A_k < 1 的模型，本库没有这个东西。
  3) 分段极大值单调下降（0.670873→0.023005）只支持启发式 A_k ≈ g_k/(2 sqrt(p_k))→0，
     它**不**证明 sup_k A_k 就在 k=4；文献里也没有人证明上确界落在前几枚。
  4) 本卡不引任何外部「已验算至多少」的数字（见 fact_check.note）；可引的只有自己的 30000000。
  5) 本卡的三条等价式里，只有第 1 与第 3 型做了逐格双通道核对；
     第 2 型 g_k < 2*sqrt(p_k) + 1 含无理数，本库把它当作第 1、3 型之间的代数桥梁登记，
     没有为它单独建第三条独立通道（这是**已知留白**，不是已证）。
  6) 解析器形状债（本批实测，不是猜测）：本库自带的 YAML 子集不折列表项续行、
     不认列表项里的 `>-`，于是「人类读的那份 .yaml」与「机器读的那份」可以不同文。
     全库实测枚数与逐条名单见 scratch/T11_PARSELOSS_face.txt；本卡按上述规则全部写成单行，
     并在写后做源码↔解析的逐枚复核（同一张面的对照格）。

