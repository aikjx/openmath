equivalent_forms:
  - "单矩判据的渐近问题等价于符号问题：kappa_1(inf) < 0 ⇒ 判据对充分大偶数是一条合法的（奇偶敏感的）归约目标；kappa_1(inf) >= 0 ⇒ 判据作为充分条件报废，必须退回完整三矩"
  - "修正项可忽略这一原本含糊的假设，被本轮收紧为可核对的形式：|2c|/单位 <= 2/单位 -> 0（c ∈ {0,1}）"

implications:
  - statement: "若 kappa_w(inf) = (log 2)^2 与 kappa_x(inf) = 1 可作为定理成立，则 OM-P-NT-0006 的单矩判据对一切充分大偶数 N 有效，从而二元 Goldbach 对一切充分大偶数成立"
    direction: "sufficient"
    note: "条件性：两处输入都用到 Hardy–Littlewood 型独立性假设，结果档裁定（§六）明写这是启发式模型结论、不是定理；本轮的作用是把「判据是否值得作为归约目标」从未知变成有明确正面指示"
  - statement: "c_B(N) 在 N = 3*10^6 处实测仍只有 0.5907（log 2 = 0.6931），两种拟合给出 0.538／0.793"
    direction: "insufficient"
    note: "数值只把 log 2 夹在中间、不确认它（相邻 N 抖动可达 0.03）；log 2 的地位是解析导出的猜测。模型对 kappa_w 的偏差须分尺度：尾部 <= 4%，全程范围 [0.648822172109222, 1.0944365703275272]，不得用 3~4% 描述全程"
  - statement: "块 2b 的 level-of-distribution 实测不蕴含任何渐近断言"
    direction: "insufficient"
    note: "取值范围已由结果档披露并自我修正：只测 x <= 10^6、q <= 2310；早期版本把 q = 1000／10000 计入而报出 ratio_to_trivial = 1.0，属小样本假象（该比值有硬上界 1），已剔除"

