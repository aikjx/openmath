assumptions:
  - "设定全部继承 OM-P-NT-0006：偶数 N、z = icbrt(N)、S_z 上 Omega <= 2、M1 = sum_{n in S_z} lambda(n)"
  - "归一化单位是 4*S(N)*N/log^2 N 型主项（Hardy–Littlewood 形式），kappa 系列即各量对该单位的比值"
  - "密度模型的两处输入 kappa_x(inf) = 1 与 c_B(inf) = log 2 依赖 Hardy–Littlewood 型独立性假设，结果档自陈该假设恰在奇偶障碍处失效"
  - "全部实测在 N <= 3*10^6（块 2b 另限 x <= 10^6、q <= 2310）；计算与实测不构成证明（红线一）"

statement_latex: >-
  两条独立陈述，强度不同，必须分开读：
  （严格）对偶数 N 有精确恒等式 M_1 = a_22 - a_11 + 2c，
  c = [spf(N-1) > floor(N^(1/3)) 且 Omega(N-1) 为偶] ∈ {0, 1}；
  （启发式）在标准奇异级数密度模型下 kappa_w(inf) = (log 2)^2、kappa_x(inf) = 1，
  故 kappa_1(inf) = (log 2)^2 - 1 ≈ -0.5195 < 0，即 OM-P-NT-0006 的单矩判据在渐近意义下存活

proposed_by: "openmath 攻坚轮（本库内部轮次，非外部文献归属）"
