partial_results:
  - year: 2026
    author: "openmath 2026-09-26 轮（本库）"
    result: "精确身份 M_1 = a_22 - a_11 + 2c 机器核对 2021 个偶数（密集段 N <= 4000 全偶 + 块 1 全部实测点，最大 N = 3000000），违反 0 例；其中 2c = 2 的情形 303 例，说明修正项不恒为 0"
  - year: 2026
    author: "openmath 2026-09-26 轮（本库）"
    result: "密度模型给出 kappa_1(inf) = (log 2)^2 - 1 = -0.5195 < 0（判据渐近存活），余量非边缘：kappa_w(inf) 即便有 30% 模型误差结论仍为负"
  - year: 2026
    author: "openmath 2026-09-26 轮（本库）"
    result: "1/log N 盲外推路线被自校验否掉：Hardy–Littlewood 预言 kappa_x(inf) = 1，实测外推读数 0.093（二次）／1.201（线性）与 1.138／1.109，一条序列未过阈值 0.25，两序列 kappa_1(inf) 区间甚至异号 ⇒ extrapolation_route_status = UNDETERMINED，外推读数一律作废"
  - year: 2026
    author: "openmath 2026-09-26 轮（本库）"
    result: "M_1 的 Möbius 展开与 CRT／等差数列分解在 9 个案例（N = 1000／2000／4000 × z = 7／11／13）上逐项精确成立，排除 p | N 时重复计数的错误"
  - year: 2026
    author: "openmath 2026-09-26 轮（本库）"
    result: "lambda 在等差数列中的和实测**低于**目标预算：相对平凡界最大比值 0.601，相对预算 x/log^2 x 最大 0.500 ⇒ 障碍是「没有已知方法能证明一致的常数因子节省」，不是数值大小问题"

