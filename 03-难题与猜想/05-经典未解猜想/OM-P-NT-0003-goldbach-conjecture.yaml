assumptions:
  - "素数按通常定义（大于 1 的正整数，只有 1 与自身两个正因子）；2 计入素数"
  - "陈述只断言 n >= 2 的偶数 2n；2 与 0 不在论域内"
  - "要求无条件证明：Hardy–Littlewood 1923 在广义黎曼假设下的结论不计为已解决"
  - "计算验证不构成证明（红线一）：已验证到的每一个偶数都不缩小反例存在的可能性"

statement_latex: >-
  对一切整数 n >= 2，存在素数 p, q 使 2n = p + q
  （等价地：每个大于 2 的偶数都是两个素数之和）

proposed_by: "Christian Goldbach 致 Leonhard Euler 的信"
proposed_year: 1742

current_status: OPEN

partial_results:
  - year: 1930
    author: "Schnirelmann"
    result: "存在常数 C，使每个大于 1 的整数都是不超过 C 个素数之和（素数加性基）"
  - year: 1937
    author: "Vinogradov"
    result: "充分大的奇数可表为三个素数之和（三素数定理）"
  - year: 1938
    author: "Chudakov, van der Corput, Estermann"
    result: "几乎所有偶数满足二元 Goldbach（例外集密度为 0）"
  - year: 1966
    author: "Chen Jingrun"
    result: "充分大偶数 = 素数 + (2 或 3 个素数之积)；1973 精化为 1+2"
  - year: 2013
    author: "Helfgott"
    result: "弱 Goldbach（每个大于 5 的奇数为三素数之和）证明完成——外部成果，本库未复算"
  - year: 2013
    author: "Oliveira e Silva, Herzog, Pardi"
    result: "二元猜想对 4 <= 2n <= 4*10^18 逐偶数验证成立——外部计算，非证明"

