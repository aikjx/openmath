equivalent_forms:
  - "记 r(2n) = #{(p,q) 素数 : p+q = 2n}，则猜想等价于 r(2n) >= 1 对一切 n >= 2"
  - "反例形式：2n 是反例 ⟺ 中央区间被「与 2n 各素因子同余」的局部覆盖集盖满（本库卷宗 2026-09-22 已把该等价式在 N=172/800/1000 精确验证）"

implications:
  - statement: "Hardy–Littlewood 圆法给出 r(2n) 的渐近主项 S(2n)*n/log^2 n，其中 S 为奇异级数；主项为正且误差被压到主项以下是二元猜想的解析路线"
    direction: "sufficient"
    note: "条件性结论：本库至今未获得无条件误差控制（见卷宗 2026-09-20 关键点攻坚的失败记录）"
  - statement: "例外集估计 E(x) = #{2n <= x : r(2n)=0} 满足 E(x) = o(x) 不蕴含二元猜想"
    direction: "insufficient"
    note: "密度 0 与逐点非空是两个独立问题；本库把「几乎所有」与「每一个」分开登记"

