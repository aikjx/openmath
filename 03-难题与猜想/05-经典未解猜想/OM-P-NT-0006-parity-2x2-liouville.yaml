kind: problem
title_zh: Liouville 奇偶（2x2）系统——哥德巴赫的三矩精确归约与单矩充分判据
title_en: The Liouville Parity 2x2 System - Exact Three-Moment Reduction of Goldbach and a One-Moment Sufficient Criterion
domain: NT
