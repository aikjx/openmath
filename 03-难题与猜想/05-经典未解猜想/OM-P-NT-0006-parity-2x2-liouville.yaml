assumptions:
  - "论域为偶数 N；筛水平 z = icbrt(N) = floor(N^(1/3))，故 S_z 上 Omega(n) <= 2，素数指示恰为 (1 - lambda(n))/2"
  - "S_z = {n : 1 <= n <= N-1, (n, P(z)) = (N-n, P(z)) = 1}，P(z) 为不超过 z 的素数之积"
  - "编码对 z 的依赖是硬的，不是可调参数：z 降到 N^(1/4) 后 Omega 可达 3，恒等式残差 4*a11 - (T - 2*M1 + M2) 在 N = 10^4／10^5／10^6 实测为 -216／-848／-5960"
  - "全部读数在 N <= 10^6 的有限尺度；计算与实测不构成证明（红线一），本记录不宣称任何无条件定理"

statement_latex: >-
  对偶数 N 与 z = icbrt(N)，记 T = |S_z|、M1 = sum_{n in S_z} lambda(n)、
  M2 = sum_{n in S_z} lambda(n) lambda(N-n)，则 a11 = #{n in S_z : n 与 N-n 皆为素数}
  满足精确恒等式 a11 = sum_{n in S_z} (1 - lambda(n))(1 - lambda(N-n))/4 = (T - 2 M1 + M2)/4；
  因而 (T, M1, M2) 三矩把 (a11, a12, a22) 唯一确定（自由度 = 0），
  且单矩充分判据 M1 < 0 给出 a11 >= -M1 >= 1，即 N 有 Goldbach 分拆

proposed_by: "openmath 攻坚轮（本库内部轮次，非外部文献归属）"
proposed_year: 2026

