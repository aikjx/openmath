equivalent_forms:
  - "在本设定下：N 有 Goldbach 分拆 <=> a11 >= 1 <=> T - 2*M1 + M2 >= 4（整数恒等式，非渐近）"
  - "充分形式：M1 < 0（即 S_z 上 P1+P1 计数多于 P2+P2 计数）=> 该 N 满足二元 Goldbach"

implications:
  - statement: "若对一切充分大偶数 N 有 sum_{n in S_z} lambda(n) < 0，则二元 Goldbach 对一切充分大偶数成立"
    direction: "sufficient"
    note: "该路线把 Goldbach 精确归约为「证明一个 Liouville 加权筛和的符号」，是 Selberg 奇偶障碍的最精简表述，不是绕过它的新工具；结果档「仍然开放」一节自陈现有筛法不能区分 Omega 的奇偶"
  - statement: "N <= 10^6 处 M1 < 0 的比例为 1.0000 不蕴含渐近符号"
    direction: "insufficient"
    note: "有限尺度实测与逐点渐近断言是两个独立问题（红线一）；符号的渐近存活性由 OM-P-NT-0007 单独处理，其密度模型读数是启发式而非定理"
  - statement: "三个矩 (T, M1, M2) 恰好定解不蕴含这三个矩可计算"
    direction: "insufficient"
    note: "代数上自由度 = 0，但 T 需要维度 2 筛在 s = log N / log z = 3 的上下界常数、M2 需要对 d 直到 e^(N^(1/3)) 一致的 Lambda 相关估计（二元 Chowla 型），均远超现有技术"

