partial_results:
  - year: 2026
    author: "openmath 2026-09-25 轮（本库）"
    result: "恒等式在 N = 1000／3000／10^4／3*10^4／10^5／3*10^5／10^6 七点机器核对为整数相等（非渐近），Omega <= 2 与 a12 = a21 全程 True"
  - year: 2026
    author: "openmath 2026-09-25 轮（本库）"
    result: "单矩判据实测：80 个偶数（20000 <= N <= 60000）中 M1 < 0 的比例为 1.0000；判据本身充分非必要（要求 P1+P1 表示数多于 P2+P2，强于 Goldbach）"
  - year: 2026
    author: "openmath 2026-09-25 轮（本库）"
    result: "把缺口精确定价：结论只需 M1 的上界比平凡界 |M1| <= T 节省一个常数因子，N = 10^6 处为 1.832（七点区间 1.655~1.860）；现有筛法对该节省给出 0"
  - year: 2026
    author: "openmath 2026-09-25 轮（本库）"
    result: "上一轮 mod-N 闭合轨道（§13）路线被实测精确证否：corr(lambda(a n mod N), lambda(a) lambda(n)) 恒为 1/a 量级且不随 N 衰减（归因＝无回绕子集密度恰为 1/a），反射量 F_N 在该置换下相关仅 ~1e-3"

