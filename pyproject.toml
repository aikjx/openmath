[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmath"
version = "0.1.0"
description = "OpenMath 开放数学联盟：面向 AI 自动化的开源数学研究库与分级验证中心"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenMath Alliance" }]
keywords = ["mathematics", "formalization", "verification", "ai-for-math", "knowledge-base"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# 核心功能零依赖，以下为可选增强（缺失时对应验证层级自动降级为 SKIP）
[project.optional-dependencies]
numeric = ["mpmath>=1.3", "numpy>=1.24"]
symbolic = ["sympy>=1.12"]
all = ["mpmath>=1.3", "numpy>=1.24", "sympy>=1.12"]

[project.scripts]
openmath = "openmath.cli:main"

[tool.setuptools]
packages = ["openmath"]

[tool.pytest.ini_options]
testpaths = ["08-工具/tests"]
